<title>Armenia in Twelve Stations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Noto+Serif+Armenian:wght@500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Palette drawn from Armenian building stone: pink Artik tuff, apricot, basalt, limestone */
  :root {
    --tuff: #b86a5b;
    --apricot: #e8912c;
    --ink: #221c1a;
    --paper: #f4eee7;
    --muted: #6f6360;
    --plate: rgba(244, 238, 231, 0.9);
    --plate-line: rgba(34, 28, 26, 0.14);
    --chip: rgba(244, 238, 231, 0.82);
    --ground: #1b1716;
    --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
    --body: "Newsreader", Georgia, "Times New Roman", serif;
    --hy: "Noto Serif Armenian", "Noto Sans Armenian", "Arian AMU", serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ink: #f1e9e1; --paper: #1d1817; --muted: #b3a59f;
      --plate: rgba(24, 20, 19, 0.86); --plate-line: rgba(241, 233, 225, 0.14); --chip: rgba(24, 20, 19, 0.78);
      --tuff: #e0917f; --apricot: #f2a44a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ink: #f1e9e1; --paper: #1d1817; --muted: #b3a59f;
    --plate: rgba(24, 20, 19, 0.86); --plate-line: rgba(241, 233, 225, 0.14); --chip: rgba(24, 20, 19, 0.78);
    --tuff: #e0917f; --apricot: #f2a44a;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); overflow: hidden; font-family: var(--body); }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }

  /* Museum-style placard, bottom left */
  .placard { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(27rem, calc(100% - 32px));
    box-sizing: border-box; padding: 1.1rem 1.2rem 1rem; display: grid; gap: 0.55rem;
    background: var(--plate); border: 1px solid var(--plate-line); border-radius: 3px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: opacity .35s ease, transform .35s ease; }
  .placard.swap { opacity: 0; transform: translateY(6px); }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .count { font: 500 0.72rem/1 var(--mono); letter-spacing: 0.14em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hy { font: 500 1rem/1.2 var(--hy); color: var(--tuff); }
  h1 { margin: 0; font: 800 clamp(1.7rem, 5.4vw, 2.5rem)/0.98 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
  .meta { margin: 0; font: 400 0.72rem/1.4 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta b { font-weight: 500; color: var(--ink); }
  .fact { margin: 0; font: 400 1rem/1.5 var(--body); max-width: 60ch; }
  .nav { display: flex; gap: 0.5rem; align-items: center; padding-top: 0.25rem; }
  .nav button { font: 500 0.78rem/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); cursor: pointer;
    background: transparent; border: 1px solid var(--plate-line); border-radius: 2px; padding: 0.6rem 0.85rem; }
  .nav button:hover { border-color: var(--tuff); color: var(--tuff); }
  .nav button:focus-visible, .ticks button:focus-visible, .chip button:focus-visible { outline: 2px solid var(--apricot); outline-offset: 2px; }
  .ticks { display: flex; gap: 4px; margin-left: auto; }
  .ticks button { width: 9px; height: 18px; padding: 0; border: 0; border-radius: 1px; background: var(--plate-line); cursor: pointer; }
  .ticks button[aria-current="true"] { background: var(--apricot); }

  /* Render settings chip, top right */
  .chip { position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center;
    padding: 0.4rem 0.5rem; background: var(--chip); border: 1px solid var(--plate-line); border-radius: 3px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font: 400 0.7rem/1 var(--mono); color: var(--muted); max-width: calc(100% - 32px); box-sizing: border-box; }
  .chip button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--plate-line); border-radius: 2px; padding: 0.35rem 0.5rem; cursor: pointer; }
  .chip button[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
  #fps { min-width: 5.5ch; text-align: right; font-variant-numeric: tabular-nums; }
  .hint { position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); font: 400 0.7rem/1.3 var(--mono); color: #f4eee7;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7); max-width: 40%; }
  #note { position: fixed; right: 16px; top: calc(56px + env(safe-area-inset-top, 0px)); font: 400 0.68rem/1.3 var(--mono); color: #f4eee7; text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
  @media (max-width: 560px) {
    .placard { padding: 0.85rem 0.9rem 0.8rem; gap: 0.4rem; }
    .fact { font-size: 0.9rem; }
    .hint { display: none; }
    .ticks { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .placard { transition: none; } }
</style>

<canvas id="stage" aria-label="3D view of the current Armenian landmark. Drag to orbit, scroll or pinch to zoom."></canvas>
<p class="hint">Drag to orbit · scroll or pinch to zoom · ← → to travel</p>

  <button id="tSSAO" type="button" aria-pressed="true">SSAO</button>

</div>

  <div class="row-top"><span class="count" id="count">01 / 12</span><span class="hy" id="hy" lang="hy"></span></div>
  <h1 id="name">Yerevan</h1>
  <p class="meta" id="meta"></p>

</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/math/SimplexNoise.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/SSAOShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/SSAOPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/ACESFilmicToneMappingShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script>
(() => {
'use strict';
// [COLOR MANAGEMENT] hex values are sRGB; convert once to linear because lighting, fog and the HDR buffer are linear
const V3 = THREE.Vector3, C = c => new THREE.Color(c).convertSRGBToLinear();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const simplex = new THREE.SimplexNoise();
const n2 = (x, z) => simplex.noise(x, z);
const fbm = (x, z, oct = 4) => { let a = 0, f = 1, s = 0.5; for (let i = 0; i < oct; i++) { a += s * n2(x * f, z * f); f *= 2; s *= 0.5; } return a; };
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ════════════════════════════════════════════════════════════════════════════
// RENDERER — physically based setup
// ════════════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const DPR = Math.min(devicePixelRatio || 1, 1.5);          // cap resolution: the biggest single fps lever
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.physicallyCorrectLights = true;                    // [PBR] light units behave physically (inverse-square, lux-like sun)
renderer.toneMapping = THREE.NoToneMapping;                 // [TONE MAPPING] scene stays linear HDR; ACES runs later as a post pass
renderer.outputEncoding = THREE.LinearEncoding;             // the final gamma pass converts linear → sRGB
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;           // [SOFT SHADOWS] percentage-closer filtering with soft kernel

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 2, 7000);
scene.fog = new THREE.FogExp2(0xbfc8d0, 0.001);             // [FOG] exponential-squared; colour and density lerp per station

// The sun: one shadow-casting directional light whose direction matches the sun baked into each HDRI
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.6;
sun.shadow.radius = 4;                                      // [SOFT SHADOWS] widens the PCF soft kernel
scene.add(sun, sun.target);

// ════════════════════════════════════════════════════════════════════════════
// PROCEDURAL TEXTURES — tileable noise for stone relief/roughness and water ripples
// ════════════════════════════════════════════════════════════════════════════
// 4D simplex sampled on a torus makes the 2D texture tile seamlessly
function tileNoise(u, v, freq, oct) {
  let a = 0, s = 0.5, f = freq;
  for (let i = 0; i < oct; i++) {
    const x = Math.cos(u * 2 * Math.PI) * f, y = Math.sin(u * 2 * Math.PI) * f, z = Math.cos(v * 2 * Math.PI) * f, w = Math.sin(v * 2 * Math.PI) * f;
    a += s * simplex.noise4d(x, y, z, w); s *= 0.5; f *= 2;
  }
  return a;
}
function noiseCanvas(size, freq, oct, fn) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), img = g.createImageData(size, size);
  const h = new Float32Array(size * size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) h[y * size + x] = tileNoise(x / size, y / size, freq, oct);
  fn(h, img.data, size); g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t;
}
// Stone: grey relief used as bumpMap (carved surface) and roughnessMap (worn vs rough patches)
const stoneTex = noiseCanvas(256, 1.2, 5, (h, d, n) => {
  for (let i = 0; i < n * n; i++) { const v = Math.max(0, Math.min(255, 150 + h[i] * 150)); d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255; }
});
// Water: height noise converted to a tangent-space normal map; scrolled every frame for moving ripples
const waterNormals = noiseCanvas(256, 1.6, 4, (h, d, n) => {
  const at = (x, y) => h[((y + n) % n) * n + ((x + n) % n)];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const dx = (at(x + 1, y) - at(x - 1, y)) * 3, dy = (at(x, y + 1) - at(x, y - 1)) * 3, inv = 1 / Math.hypot(dx, dy, 1), i = (y * n + x) * 4;
    d[i] = (-dx * inv * 0.5 + 0.5) * 255; d[i + 1] = (-dy * inv * 0.5 + 0.5) * 255; d[i + 2] = (inv * 0.5 + 0.5) * 255; d[i + 3] = 255;
  }
});
waterNormals.repeat.set(24, 24);

// ════════════════════════════════════════════════════════════════════════════
// PBR MATERIALS — MeshPhysicalMaterial with metalness/roughness chosen per surface
// ════════════════════════════════════════════════════════════════════════════
function stone(color, { rough = 0.88, bump = 0.6, rep = 2 } = {}) {
  const map = stoneTex.clone(); map.needsUpdate = true; map.repeat.set(rep, rep);
  // [PBR] rough dielectric stone: metalness 0, high roughness, bump relief for carved/worn tuff
  return new THREE.MeshPhysicalMaterial({ color: C(color), metalness: 0, roughness: rough, roughnessMap: map, bumpMap: map, bumpScale: bump * 0.35 });
}
const M = {
  pinkTuff: stone('#c48878', { rough: 0.82, bump: 0.35, rep: 3 }),
  roseTuff: stone('#b87665', { rough: 0.85, bump: 0.35, rep: 3 }),
  carved: stone('#8d8377', { rough: 0.96, bump: 1.2, rep: 2 }),        // Geghard: rough, deeply carved rock
  basalt: stone('#6f6a65', { rough: 0.78, bump: 0.5, rep: 3 }),        // Garni: smoother dressed basalt
  basaltDark: stone('#3e3a38', { rough: 0.7, bump: 0.5, rep: 3 }),
  limestone: stone('#d9cdb8', { rough: 0.8, bump: 0.3, rep: 3 }),
  ochreTuff: stone('#c2a07c', { rough: 0.88, bump: 0.45, rep: 3 }),
  redRock: stone('#9d4a31', { rough: 0.92, bump: 1.0, rep: 2 }),       // Noravank cliffs
  redTuff: stone('#b3674a', { rough: 0.85, bump: 0.5, rep: 3 }),
  blackTuff: stone('#3b3533', { rough: 0.86, bump: 0.5, rep: 3 }),     // Gyumri
  orangeTuff: stone('#b06a44', { rough: 0.86, bump: 0.5, rep: 3 }),
  slate: stone('#5e5a57', { rough: 0.6, bump: 0.2, rep: 4 }),          // stone roof slabs: a touch smoother
  paving: stone('#a08a80', { rough: 0.72, bump: 0.08, rep: 6 }),
  cobble: stone('#6e645c', { rough: 0.75, bump: 1.4, rep: 30 }),
  rock: stone('#6b6862', { rough: 0.94, bump: 1.1, rep: 2 }),
  dark: new THREE.MeshPhysicalMaterial({ color: C('#140f0d'), roughness: 1, metalness: 0 }),
  // [PBR] wood: dielectric, mid roughness, light clearcoat for varnish
  wood: new THREE.MeshPhysicalMaterial({ color: C('#6b4428'), roughness: 0.55, metalness: 0, clearcoat: 0.3, clearcoatRoughness: 0.5 }),
  tile: new THREE.MeshPhysicalMaterial({ color: C('#9a3b26'), roughness: 0.5, metalness: 0, clearcoat: 0.4, clearcoatRoughness: 0.3 }),
  // [PBR] glass: very low roughness so windows mirror the HDRI sky
  glass: new THREE.MeshPhysicalMaterial({ color: C('#1c2428'), roughness: 0.06, metalness: 0.2, clearcoat: 1, reflectivity: 0.9 }),
  // [PBR] metals: metalness 1 so colour comes from reflections, roughness sets how sharp they are
  gold: new THREE.MeshPhysicalMaterial({ color: C('#d9a84b'), roughness: 0.25, metalness: 1 }),
  steel: new THREE.MeshPhysicalMaterial({ color: C('#8a9097'), roughness: 0.35, metalness: 1 }),
  cable: new THREE.MeshPhysicalMaterial({ color: C('#2a2c30'), roughness: 0.45, metalness: 1 }),
  cabin: new THREE.MeshPhysicalMaterial({ color: C('#b8282a'), roughness: 0.3, metalness: 0.4, clearcoat: 1, clearcoatRoughness: 0.08 }),
  // [PBR] foliage: dielectric with sheen for the soft velvet rim light on leaves and needles
  leaf: new THREE.MeshPhysicalMaterial({ color: C('#3f6a33'), roughness: 0.8, metalness: 0, sheen: C('#3a5a2a') }),
  conifer: new THREE.MeshPhysicalMaterial({ color: C('#23422a'), roughness: 0.85, metalness: 0, sheen: C('#1f3a22') }),
  vine: new THREE.MeshPhysicalMaterial({ color: C('#56802f'), roughness: 0.75, metalness: 0, sheen: C('#3a5a1a') }),
  trunk: new THREE.MeshPhysicalMaterial({ color: C('#4a3526'), roughness: 0.9, metalness: 0 }),
  // [PBR] snow: bright, fairly rough, sheen for the sparkle-free soft glint of settled snow
  snow: new THREE.MeshPhysicalMaterial({ color: C('#f2f5f8'), roughness: 0.5, metalness: 0, sheen: C('#dfe8f0'), clearcoat: 0.2, clearcoatRoughness: 0.6 }),
  // [PBR] water: near-zero roughness + clearcoat = glossy surface reflecting the environment; scrolling normal map adds ripples
  water: new THREE.MeshPhysicalMaterial({ color: C('#16414f'), roughness: 0.05, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.04,
    normalMap: waterNormals, normalScale: new THREE.Vector2(0.35, 0.35), transparent: true, opacity: 0.88 }),
  waterFall: new THREE.MeshPhysicalMaterial({ color: C('#e8f4f8'), roughness: 0.2, metalness: 0, emissive: C('#9fc4d4'), emissiveIntensity: 0.6,
    transparent: true, opacity: 0.85, depthWrite: false }),
  jet: new THREE.MeshPhysicalMaterial({ color: C('#e6f5ff'), roughness: 0.1, emissive: C('#bfe4ff'), emissiveIntensity: 1.8, transparent: true, opacity: 0.55, depthWrite: false }),
  clockFace: new THREE.MeshPhysicalMaterial({ color: C('#f5efe0'), roughness: 0.3, emissive: C('#ffe7b0'), emissiveIntensity: 3 }),   // bright enough to bloom
  terrain: new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.93, metalness: 0 }),
};

// ════════════════════════════════════════════════════════════════════════════
// HDRI ENVIRONMENT LIGHTING — procedural Radiance (.hdr) files → RGBELoader → PMREMGenerator
// ════════════════════════════════════════════════════════════════════════════
// Each station gets its own sky "mood". The sky is rendered to float pixels, encoded as a real RGBE .hdr file,
// decoded by THREE.RGBELoader, and prefiltered by PMREMGenerator into scene.environment (image-based lighting
// for every PBR material) and scene.background. Swap makeHDR() for a downloaded .hdr to use photographic skies.
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const rgbe = new THREE.RGBELoader().setDataType(THREE.HalfFloatType);
const sunDir = (elev, azim) => { const e = elev * Math.PI / 180, a = azim * Math.PI / 180; return new V3(Math.cos(e) * Math.cos(a), Math.sin(e), Math.cos(e) * Math.sin(a)); };
function makeHDR(m) {
  const W = 512, H = 256, head = `#?RADIANCE\n# procedural sky\nFORMAT=32-bit_rle_rgbe\n\n-Y ${H} +X ${W}\n`;
  const hb = new TextEncoder().encode(head), buf = new Uint8Array(hb.length + W * H * 4); buf.set(hb);
  const S = sunDir(m.sunElev, m.sunAzim), zen = C(m.zenith), hor = C(m.horizon), grd = C(m.ground), sc = C(m.sunColor);
  let o = hb.length;
  for (let y = 0; y < H; y++) {
    const lat = (0.5 - (y + 0.5) / H) * Math.PI, cy = Math.cos(lat), dy = Math.sin(lat);
    for (let x = 0; x < W; x++) {
      const lon = ((x + 0.5) / W - 0.5) * 2 * Math.PI, dx = Math.cos(lon) * cy, dz = Math.sin(lon) * cy;
      let r, g, b;
      if (dy >= 0) {
        const t = Math.pow(dy, m.gradient || 0.45);
        r = hor.r + (zen.r - hor.r) * t; g = hor.g + (zen.g - hor.g) * t; b = hor.b + (zen.b - hor.b) * t;
        const cl = m.clouds ? Math.max(0, fbm(dx / (dy + 0.12) * 1.3, dz / (dy + 0.12) * 1.3, 4) * 1.6 - 0.1) * m.clouds * smooth(0, 0.15, dy) : 0;
        if (cl > 0) { r = r * (1 - cl) + m.cloud[0] * cl; g = g * (1 - cl) + m.cloud[1] * cl; b = b * (1 - cl) + m.cloud[2] * cl; }
      } else {
        const t = smooth(0, 0.12, -dy); r = hor.r * (1 - t) + grd.r * t; g = hor.g * (1 - t) + grd.g * t; b = hor.b * (1 - t) + grd.b * t;
      }
      // Sun: a very bright disc (drives reflections and bloom) plus a wide glow through the atmosphere
      const cs = dx * S.x + dy * S.y + dz * S.z;
      const glow = Math.pow(Math.max(0, cs), 8) * m.glow + Math.pow(Math.max(0, cs), 200) * m.glow * 4 + (cs > 0.9994 ? m.sunPower : 0);
      r += sc.r * glow; g += sc.g * glow; b += sc.b * glow;
      r *= m.skyGain; g *= m.skyGain; b *= m.skyGain;
      // RGBE encode (shared exponent)
      const v = Math.max(r, g, b);
      if (v < 1e-32) { buf[o++] = 0; buf[o++] = 0; buf[o++] = 0; buf[o++] = 0; continue; }
      const e = Math.ceil(Math.log2(v)), f = 256 / Math.pow(2, e);
      buf[o++] = Math.min(255, r * f); buf[o++] = Math.min(255, g * f); buf[o++] = Math.min(255, b * f); buf[o++] = e + 128;
    }
  }
  // A flat (non run-length) file must not start with the RLE marker bytes 2,2
  if (buf[hb.length] === 2 && buf[hb.length + 1] === 2) buf[hb.length] = 3;
  const d = rgbe.parse(buf.buffer);
  const tex = new THREE.DataTexture(d.data, d.width, d.height, d.format, d.type);
  tex.encoding = THREE.LinearEncoding; tex.minFilter = tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  tex.flipY = true; tex.mapping = THREE.EquirectangularReflectionMapping; tex.needsUpdate = true;
  return { background: tex, environment: pmrem.fromEquirectangular(tex).texture };
}

// ════════════════════════════════════════════════════════════════════════════
// GEOMETRY HELPERS
// ════════════════════════════════════════════════════════════════════════════
function mesh(geo, mat, x = 0, y = 0, z = 0, parent, o = {}) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);

const renderPass = new THREE.RenderPass(scene, camera);
// [SSAO] screen-space ambient occlusion darkens creases, corners and contact points
const ssao = new THREE.SSAOPass(scene, camera, innerWidth * DPR, innerHeight * DPR);
ssao.kernelRadius = 6; ssao.minDistance = 0.000004; ssao.maxDistance = 0.0012;
ssao.beautyRenderTarget.texture.type = THREE.HalfFloatType;          // keep its beauty buffer HDR too
ssao.normalRenderTarget.depthTexture.type = THREE.UnsignedIntType;    // 24/32-bit depth: fewer banding artefacts at distance
const ssaoOverride = ssao.renderOverride.bind(ssao);
ssao.renderOverride = (...a) => { const bg = scene.background; scene.background = null; ssaoOverride(...a); scene.background = bg; };
// [BLOOM] threshold above 1.0 in linear HDR: only the sun, its reflections and emissive surfaces glow
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.45, 1.6);
// [TONE MAPPING] ACES Filmic, exposure animated per station
const aces = new THREE.ShaderPass(THREE.ACESFilmicToneMappingShader);
const gamma = new THREE.ShaderPass(THREE.GammaCorrectionShader);    // linear → sRGB for display
composer.addPass(renderPass); composer.addPass(ssao); composer.addPass(bloom); composer.addPass(aces); composer.addPass(gamma);
function setSSAO(on) { ssao.enabled = on; renderPass.enabled = !on; document.getElementById('tSSAO').setAttribute('aria-pressed', String(on)); }
function setBloom(on) { bloom.enabled = on; document.getElementById('tBloom').setAttribute('aria-pressed', String(on)); }
setSSAO(true);

// ════════════════════════════════════════════════════════════════════════════
// CAMERA — manual orbit controls (drag / wheel / pinch) with damping, plus tweened travel
// ════════════════════════════════════════════════════════════════════════════
const view = { target: new V3(), r: 150, th: 1.8, ph: 1.2, vth: 0, vph: 0, min: 40, max: 400 };
const pointers = new Map();
let lastPinch = 0, lastInput = performance.now();
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); canvas.classList.add('dragging'); lastInput = performance.now(); });
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  if (pointers.size === 1 && !tween) { view.vth = -(e.clientX - p.x) * 0.0055; view.vph = -(e.clientY - p.y) * 0.004; }
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (lastPinch) view.r = THREE.MathUtils.clamp(view.r * lastPinch / d, view.min, view.max);
    lastPinch = d;
  }
  lastInput = performance.now();
});
const endPointer = e => { pointers.delete(e.pointerId); if (pointers.size < 2) lastPinch = 0; if (!pointers.size) canvas.classList.remove('dragging'); };
canvas.addEventListener('pointerup', endPointer); canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); if (tween) return; view.r = THREE.MathUtils.clamp(view.r * Math.exp(e.deltaY * 0.0012), view.min, view.max); lastInput = performance.now(); }, { passive: false });

// Transition state: target, radius and angles tween together; the camera arcs upward mid-flight
let cur = 0, tween = null;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const angLerp = (a, b, t) => { let d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; return a + d * t; };
const look = { fogColor: C('#fff'), fogDensity: 0.001, exposure: 1, sunColor: C('#fff'), sun: 3, sunDir: new V3(0, 1, 0), shadow: 120 };
function stationLook(S) { return { fogColor: C(S.fog.color).multiplyScalar(S.mood.skyGain * 0.95), fogDensity: S.fog.density, exposure: S.exposure, sunColor: C(S.mood.sunColor), sun: S.sun, sunDir: sunDir(S.mood.sunElev, S.mood.sunAzim), shadow: S.shadow }; }
function ensureEnv(S) { if (!S.env) S.env = makeHDR(S.mood); return S.env; }
function applyEnv(S) { const e = ensureEnv(S); scene.environment = e.environment; scene.background = e.background; }
function setShadowBox(size) { const c = sun.shadow.camera; c.left = c.bottom = -size; c.right = c.top = size; c.near = 1; c.far = 1600; c.updateProjectionMatrix(); }

// ════════════════════════════════════════════════════════════════════════════
// UI — placard text, next/prev, station ticks, keyboard
// ════════════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id), placard = $('placard');
STATIONS.forEach((S, i) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', `${i + 1}. ${S.name}`); b.title = S.name; b.addEventListener('click', () => goTo(i)); $('ticks').append(b); });
function writePlacard(i) {
  const S = STATIONS[i];
  $('count').textContent = `${String(i + 1).padStart(2, '0')} / ${STATIONS.length}`;
  $('hy').textContent = S.hy; $('name').textContent = S.name; $('fact').textContent = S.fact;
  const [coords, ...rest] = S.meta.split(' · '); $('meta').innerHTML = ''; const b = document.createElement('b'); b.textContent = coords; $('meta').append(b, document.createTextNode(rest.length ? ' · ' + rest.join(' · ') : ''));
  [...$('ticks').children].forEach((t, k) => t.setAttribute('aria-current', String(k === i)));
}
function goTo(i) {
  i = (i + STATIONS.length) % STATIONS.length;
  if (i === cur && !tween) return;
  const S = STATIONS[i];
  const from = { target: view.target.clone(), r: view.r, th: view.th, ph: view.ph, look: { ...look, fogColor: look.fogColor.clone(), sunColor: look.sunColor.clone(), sunDir: look.sunDir.clone() } };
  const to = { target: S.origin.clone().add(new V3(0, S.cam.y, 0)), r: S.cam.r, th: S.cam.th, ph: S.cam.ph, look: stationLook(S) };
  ensureEnv(S);                                                  // build the next HDRI before the flight starts
  tween = { from, to, t0: performance.now(), dur: reduceMotion ? 1 : 2600, next: i, swapped: false };
  view.min = S.cam.min; view.max = S.cam.max; view.vth = view.vph = 0;
  placard.classList.add('swap');
  setTimeout(() => { writePlacard(i); placard.classList.remove('swap'); }, reduceMotion ? 0 : 380);
  cur = i;
}
$('prev').addEventListener('click', () => goTo(cur - 1));
$('next').addEventListener('click', () => goTo(cur + 1));
addEventListener('keydown', e => { if (e.key === 'ArrowRight') goTo(cur + 1); else if (e.key === 'ArrowLeft') goTo(cur - 1); });
$('tSSAO').addEventListener('click', () => { setSSAO(!ssao.enabled); $('note').textContent = ''; });
$('tBloom').addEventListener('click', () => setBloom(!bloom.enabled));

// Start at station 1 without a flight
{
  const S = STATIONS[0];
  view.target.copy(S.origin).y += S.cam.y; view.r = S.cam.r; view.th = S.cam.th; view.ph = S.cam.ph; view.min = S.cam.min; view.max = S.cam.max;
  Object.assign(look, stationLook(S)); applyEnv(S); setShadowBox(S.shadow); writePlacard(0);
}

// ════════════════════════════════════════════════════════════════════════════
// FRAME LOOP
// ════════════════════════════════════════════════════════════════════════════
const clock = new THREE.Clock();
let frames = 0, fpsT = performance.now(), fpsAvg = 60, perfChecked = false, bootT = performance.now();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime, now = performance.now();

  let lift = 0;
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur), e = ease(k), A = tween.from, B = tween.to;
    view.target.lerpVectors(A.target, B.target, e);
    view.r = A.r + (B.r - A.r) * e; view.th = angLerp(A.th, B.th, e); view.ph = A.ph + (B.ph - A.ph) * e;
    lift = Math.sin(Math.PI * e) * 420;                             // arc up and over between stations
    look.fogColor.copy(A.look.fogColor).lerp(B.look.fogColor, e);
    look.fogDensity = A.look.fogDensity + (B.look.fogDensity - A.look.fogDensity) * e;
    look.exposure = A.look.exposure + (B.look.exposure - A.look.exposure) * e;
    look.sunColor.copy(A.look.sunColor).lerp(B.look.sunColor, e);
    look.sun = A.look.sun + (B.look.sun - A.look.sun) * e;
    look.sunDir.copy(A.look.sunDir).lerp(B.look.sunDir, e).normalize();
    if (!tween.swapped && k >= 0.5) { tween.swapped = true; applyEnv(STATIONS[tween.next]); setShadowBox(B.look.shadow); }   // swap HDRI at the top of the arc
    if (k >= 1) tween = null;
  } else {
    // Damped orbit, and a slow idle drift after 8 s without input
    view.th += view.vth; view.ph = THREE.MathUtils.clamp(view.ph + view.vph, 0.35, 1.48);
    view.vth *= 0.88; view.vph *= 0.88;
    if (!reduceMotion && now - lastInput > 8000) view.th += dt * 0.03;
  }
  const sp = Math.sin(view.ph);
  camera.position.set(view.target.x + view.r * sp * Math.cos(view.th), view.target.y + view.r * Math.cos(view.ph) + lift, view.target.z + view.r * sp * Math.sin(view.th));
  camera.lookAt(view.target);

  // Atmosphere follows the tweened look
  scene.fog.color.copy(look.fogColor); scene.fog.density = look.fogDensity;
  aces.uniforms.exposure.value = look.exposure;
  sun.color.copy(look.sunColor); sun.intensity = look.sun;
  sun.target.position.copy(view.target); sun.position.copy(view.target).addScaledVector(look.sunDir, 700);

  // Only animate and reflect what can be seen: current station and the one being flown to
  const active = new Set([cur, tween ? tween.next : cur]);
  STATIONS.forEach((S, i) => {
    const on = active.has(i) || (tween && Math.abs(i * SPACING - view.target.x) < SPACING * 0.75);
    S.group.visible = on;
    if (S.mirror) S.mirror.visible = on;
    if (on && S.anim) S.anim(t);
  });
  waterNormals.offset.set(t * 0.012, t * 0.008);                   // [PBR water] ripples drift

  composer.render(dt);

  // FPS meter; if the first seconds run slow, drop SSAO (the most expensive pass) and say so
  frames++;
  if (now - fpsT >= 500) { fpsAvg = frames * 1000 / (now - fpsT); frames = 0; fpsT = now; $('fps').textContent = `${Math.round(fpsAvg)} fps`; }
  if (!perfChecked && now - bootT > 4000) { perfChecked = true; if (fpsAvg < 45 && ssao.enabled) { setSSAO(false); $('note').textContent = 'SSAO turned off to hold the frame rate'; } }
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight);
});
// Warm the remaining HDRIs in idle time so later flights never stall
let warm = 1; const idle = window.requestIdleCallback || (f => setTimeout(f, 200));
const warmNext = () => { if (warm < STATIONS.length) { ensureEnv(STATIONS[warm++]); idle(warmNext); } };
idle(warmNext);
})();
</script>
