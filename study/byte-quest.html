<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Byte Quest</title>
<style>
/* Layout: one centered column (max 780px) of pixel-edged panels on a dark CRT grid.
   The map is a dotted trail of five world cards; play screens stack HUD, question, feedback. */
:root {
  color-scheme: dark;
  /* ground and panels */
  --bg: #0f0c24;
  --panel: #1a1638;
  --panel-2: #241e4d;
  --edge: #3b3275;
  --code-bg: #0a0819;
  --grid: rgba(160, 150, 255, 0.05);
  --scan: rgba(255, 255, 255, 0.022);
  --bevel: rgba(0, 0, 0, 0.28);
  --shadow: #07051a;
  --shadow-logo: #2a1f5c;
  /* ink */
  --ink: #f2efff;
  --ink-2: #bdb6ea;
  --ink-3: #8f87c7;
  --on-bright: #140f2e;
  /* one color per Big Idea */
  --w1: #ff6fae;
  --w2: #37d8f5;
  --w3: #b6f03c;
  --w4: #ffa53a;
  --w5: #b08cff;
  /* game states */
  --gold: #ffd447;
  --gold-bg: rgba(255, 212, 71, 0.12);
  --good: #4fe08a;
  --good-bg: rgba(79, 224, 138, 0.13);
  --bad: #ff5d6c;
  --bad-bg: rgba(255, 93, 108, 0.13);
  /* type */
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--ink);
  font: 400 1rem/1.55 var(--font-ui);
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
  background: repeating-linear-gradient(to bottom, var(--scan) 0 1px, transparent 1px 3px);
}
button, input { font: inherit; }
.app { max-width: 780px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 72px; }
.enter { animation: rise 0.25s steps(3) both; }

/* ---------- pixel frame: 4px edges with notched corners ---------- */
.px, .btn, .choice, .opt, .toast {
  --pe: var(--edge);
  box-shadow:
    0 -4px 0 0 var(--pe), 0 4px 0 0 var(--pe),
    -4px 0 0 0 var(--pe), 4px 0 0 0 var(--pe);
}
.px { background: var(--panel); }
.card { padding: 20px; margin-top: 24px; }
.card > h2, .section-title {
  font: 800 0.95rem/1.3 var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin: 0 0 14px;
}
.label {
  font: 700 0.7rem/1.3 var(--font-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.lead { margin: 0; color: var(--ink-2); max-width: 62ch; }
.muted { color: var(--ink-3); }

/* ---------- pixel text, sprites, icons ---------- */
.ptext { display: inline-block; height: var(--h, 24px); width: calc(var(--h, 24px) * var(--pw) / 8); max-width: 100%; vertical-align: middle; }
.ptext .pt-sh { fill: var(--pt-shadow, var(--shadow)); }
.ptext .pt-fg { fill: currentColor; }
.sprite { display: block; image-rendering: pixelated; }
.ico { display: inline-block; height: 1em; width: calc(1em * var(--iw) / var(--ih)); vertical-align: -0.12em; flex: none; }

/* ---------- buttons ---------- */
.btn {
  --pe: var(--edge);
  appearance: none;
  border: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.55rem;
  min-height: 44px;
  padding: 0.8rem 1.1rem;
  font: 700 0.8rem/1.15 var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--panel-2);
  box-shadow:
    0 -4px 0 0 var(--pe), 0 4px 0 0 var(--pe),
    -4px 0 0 0 var(--pe), 4px 0 0 0 var(--pe),
    inset 0 -4px 0 0 var(--bevel);
  transition: transform 0.08s, filter 0.15s;
}
.btn:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn:focus-visible, .choice:focus-visible, .cell:focus-visible, .pu:focus-visible, summary:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 6px;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { --pe: var(--gold); background: var(--gold); color: var(--on-bright); }
.btn-world { --pe: var(--wc); background: var(--wc); color: var(--on-bright); }
.btn-boss { --pe: var(--bad); background: var(--bad); color: var(--on-bright); }
.btn-ghost { --pe: var(--edge); background: transparent; }
.btn-sm { min-height: 36px; padding: 0.5rem 0.75rem; font-size: 0.72rem; }
.btn-big { font-size: 1rem; padding: 1.05rem 1.3rem; }
.btn.armed { --pe: var(--bad); color: var(--bad); }

/* ---------- top bar ---------- */
.topbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px; margin-bottom: 8px; }
.topbar-title { margin: 0; line-height: 0; text-align: center; color: var(--ink); }
.topbar-title .ptext { --h: 26px; }
.topbar-lv { text-align: right; font: 0.72rem/1.3 var(--font-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.topbar-lv b { display: block; color: var(--gold); font-size: 0.95rem; }

/* ---------- home ---------- */
.hero { text-align: center; padding-block: 16px 4px; }
.logo { margin: 0; line-height: 0; }
.logo .ptext { --h: clamp(40px, 12.5vw, 96px); --pt-shadow: var(--shadow-logo); }
.bits { font: 0.75rem/1.4 var(--font-mono); letter-spacing: 0.2em; color: var(--ink-3); margin: 14px 0 0; }
.tagline { color: var(--ink-2); max-width: 52ch; margin: 10px auto 0; text-wrap: balance; }
.notice { --pe: var(--bad); margin-top: 24px; padding: 14px 16px; }
.notice ul { margin: 6px 0 0; padding-left: 1.1em; color: var(--ink-2); font-size: 0.88rem; }
.player { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; align-items: center; padding: 16px; margin-top: 28px; }
.player .sprite { width: 56px; height: 61px; animation: bob 1.2s steps(2) infinite; }
.player-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.player-top .lv { color: var(--gold); font-weight: 800; font-size: 1.25rem; }
.player-top .xp-num { color: var(--ink-2); font-size: 0.85rem; }
.xpbar { height: 10px; background: var(--bg); margin: 8px 0 12px; }
.xpbar > div { height: 100%; background: var(--gold); }
.player-stats { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0; }
.player-stats dt { font: 700 0.66rem/1.3 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.player-stats dd { margin: 0; font: 700 1rem var(--font-mono); font-variant-numeric: tabular-nums; }
.inv { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; border-top: 2px dashed var(--edge); }
.inv-item { font: 0.78rem var(--font-mono); background: var(--bg); padding: 6px 10px; color: var(--ink-2); }
.inv-item b { color: var(--ink); }
.menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 30px; }
.menu .btn { flex-direction: column; align-items: flex-start; text-align: left; padding: 14px 16px; }
.menu .btn small { font: 500 0.74rem/1.3 var(--font-ui); letter-spacing: 0; text-transform: none; color: var(--ink-3); }
.menu .btn-big { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: center; }
.rules { margin-top: 30px; padding: 18px 20px; }
.rules ul { margin: 10px 0 0; padding-left: 1.1em; color: var(--ink-2); }
.rules li + li { margin-top: 6px; }
.rules b { color: var(--ink); }
.kbd { font: 700 0.78em var(--font-mono); background: var(--bg); padding: 0.1em 0.4em; color: var(--ink); }

/* ---------- world map ---------- */
.map-intro { margin: 16px 0 0; }
.trail { list-style: none; margin: 34px 0 0; padding: 0; display: grid; gap: 44px; position: relative; }
.trail::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 24px;
  bottom: 24px;
  width: 4px;
  transform: translateX(-50%);
  background: repeating-linear-gradient(to bottom, var(--edge) 0 8px, transparent 8px 16px);
}
.node { position: relative; }
.node-card { --pe: var(--wc); position: relative; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; padding: 18px; }
.node-badge { width: 64px; height: 64px; display: grid; place-items: center; background: var(--wc); color: var(--on-bright); }
.node-badge .ptext { --h: 34px; --pt-shadow: transparent; }
.node-name { font: 800 1.15rem/1.25 var(--font-ui); margin: 2px 0 4px; text-wrap: balance; }
.node-topics { color: var(--ink-2); font-size: 0.9rem; margin: 0 0 10px; }
.node-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font: 0.8rem var(--font-mono); color: var(--ink-2); margin-bottom: 16px; font-variant-numeric: tabular-nums; }
.node-stats .stars { color: var(--gold); }
.node-actions { display: flex; flex-wrap: wrap; gap: 16px; }
.here { position: absolute; top: -34px; right: 16px; display: flex; align-items: flex-end; gap: 6px; font: 700 0.65rem var(--font-mono); letter-spacing: 0.12em; color: var(--gold); }
.here .sprite { width: 30px; height: 33px; animation: bob 1s steps(2) infinite; }
.stars { display: inline-flex; gap: 3px; }
.stars > span { color: var(--edge); }
.stars > .on { color: var(--gold); }

/* ---------- HUD ---------- */
.hud {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  grid-template-areas: "quit mode mid score" "bar bar bar bar";
  align-items: center;
  gap: 10px 18px;
  padding: 10px 12px;
}
.hud > .btn { grid-area: quit; }
.hud-mode { grid-area: mode; min-width: 0; }
.hud-lives, .hud-timer { grid-area: mid; }
.hud-score { grid-area: score; text-align: right; }
.hud-progress { grid-area: bar; height: 6px; background: var(--bg); }
.hud-progress > div { height: 100%; background: var(--wc, var(--gold)); transition: width 0.3s; }
.hud .label { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud b { font: 700 0.95rem/1.3 var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hud-lives { display: flex; gap: 6px; color: var(--bad); }
.heart .ico { height: 20px; }
.heart.empty { color: var(--edge); }
.heart.lost { animation: heartLost 0.6s steps(4); }
.streak.hot { color: var(--gold); }
#timer.low { color: var(--bad); }
.hud.fx-hurt { animation: shake 0.35s steps(4); }
.flash { position: fixed; inset: 0; pointer-events: none; z-index: 90; background: var(--bad); opacity: 0; animation: flash 0.45s steps(3); }

/* ---------- boss ---------- */
.boss { --pe: var(--wc); display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 20px; align-items: center; padding: 16px; margin-top: 24px; }
.boss-sprite .sprite { width: 112px; height: 112px; animation: bob 1.2s steps(2) infinite; }
.boss-sprite.fx-hit .sprite { animation: hit 0.5s steps(5); }
.boss-sprite.fx-attack .sprite { animation: lunge 0.5s steps(4); }
.boss-name { display: block; font: 800 1.2rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; color: var(--wc); margin-top: 2px; }
.hp { display: flex; align-items: center; gap: 10px; margin: 10px 0 8px; }
.hp-label { font: 800 0.75rem var(--font-mono); color: var(--ink-2); }
.hp-segs { display: flex; gap: 4px; flex: 1; }
.hp-segs span { flex: 1; height: 14px; background: var(--bg); box-shadow: inset 0 0 0 2px var(--edge); }
.hp-segs span.on { background: var(--bad); box-shadow: inset 0 -4px 0 0 var(--bevel); }
.boss-rule { margin: 0; font-size: 0.85rem; color: var(--ink-2); }

/* ---------- question card ---------- */
.qcard { padding: 22px; margin-top: 24px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { font: 700 0.66rem/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 8px; background: var(--bg); color: var(--ink-2); }
.chip-world { background: var(--wc); color: var(--on-bright); }
.chip-two { background: var(--gold); color: var(--on-bright); }
.chip-boss { background: var(--bad); color: var(--on-bright); }
.nudge { animation: shake 0.35s steps(4); }
.prompt { font: 600 1.1rem/1.5 var(--font-ui); margin: 0; max-width: 68ch; text-wrap: pretty; }
.prompt:focus { outline: none; }
.ic { font-family: var(--font-mono); font-size: 0.9em; background: var(--code-bg); color: var(--w2); padding: 0.08em 0.35em; white-space: pre-wrap; }

.code { --pe: var(--edge); display: block; margin-top: 18px; background: var(--code-bg); overflow-x: auto; box-shadow: 0 -4px 0 0 var(--pe), 0 4px 0 0 var(--pe), -4px 0 0 0 var(--pe), 4px 0 0 0 var(--pe); }
.code-inner { display: block; width: max-content; min-width: 100%; padding: 14px 16px 14px 0; font: 500 0.92rem/1.6 var(--font-mono); }
.ln { display: grid; grid-template-columns: 3em auto; }
.ln-n { color: var(--ink-3); opacity: 0.7; text-align: right; padding-right: 1.1em; user-select: none; }
.ln-c { white-space: pre; }
.code-sm { margin: 0; box-shadow: none; }
.code-sm .code-inner { padding: 8px 12px; font-size: 0.84rem; line-height: 1.5; }
.code-sm .ln { grid-template-columns: auto; }
.figure pre { margin: 0; padding: 14px 16px; font: 600 0.95rem/1.3 var(--font-mono); white-space: pre; color: var(--ink); }
.t-kw { color: var(--gold); }
.t-fn { color: var(--w2); }
.t-num { color: var(--w1); }
.t-str { color: var(--w3); }
.t-op { color: var(--w4); }

.choices { display: grid; gap: 16px; margin-top: 22px; }
.choice {
  --pe: var(--edge);
  appearance: none;
  border: 0;
  width: 100%;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) 22px;
  align-items: center;
  gap: 14px;
  min-height: 56px;
  padding: 12px 14px;
  text-align: left;
  color: var(--ink);
  background: var(--panel-2);
  cursor: pointer;
  transition: transform 0.1s, background-color 0.15s;
}
.choice:hover:not(:disabled) { --pe: var(--ink-3); transform: translateX(3px); }
.choice .letter { width: 32px; height: 32px; display: grid; place-items: center; font: 800 0.9rem var(--font-mono); background: var(--bg); color: var(--ink-2); }
.choice-body { min-width: 0; }
.choice-text { display: block; }
.choice .mark .ico { height: 18px; }
.choice.selected { --pe: var(--gold); background: var(--gold-bg); }
.choice.selected .letter { background: var(--gold); color: var(--on-bright); }
.choice.correct { --pe: var(--good); background: var(--good-bg); }
.choice.correct .letter, .choice.missed .letter { background: var(--good); color: var(--on-bright); }
.choice.missed { --pe: var(--good); }
.choice.correct .mark, .choice.missed .mark { color: var(--good); }
.choice.wrong { --pe: var(--bad); background: var(--bad-bg); }
.choice.wrong .letter { background: var(--bad); color: var(--on-bright); }
.choice.wrong .mark { color: var(--bad); }
.choice.dim { opacity: 0.5; }
.choice.removed { opacity: 0.28; text-decoration: line-through; }
.choice:disabled { cursor: default; }
.hintbox { display: flex; gap: 10px; align-items: flex-start; margin-top: 20px; padding: 12px 14px; background: var(--gold-bg); color: var(--ink); }
.hintbox .ico { color: var(--gold); margin-top: 0.2em; }

.actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 20px; margin-top: 26px; padding-top: 18px; border-top: 2px dashed var(--edge); }
.powerups { display: flex; flex-wrap: wrap; gap: 10px; }
.pu {
  appearance: none;
  border: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 38px;
  padding: 6px 10px;
  font: 700 0.74rem var(--font-mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--bg);
  box-shadow: inset 0 0 0 2px var(--edge);
}
.pu b { background: var(--panel-2); padding: 2px 6px; color: var(--gold); }
.pu:hover:not(:disabled) { box-shadow: inset 0 0 0 2px var(--ink-3); }
.pu:disabled { opacity: 0.4; cursor: not-allowed; }
.lock-wrap { display: flex; align-items: center; gap: 14px; margin-left: auto; }
.need { font: 0.78rem var(--font-mono); color: var(--ink-3); }
.sealed { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--ink-2); }

/* ---------- feedback ---------- */
.feedback { margin-top: 28px; padding: 20px 22px; scroll-margin-top: 130px; }
.feedback.good { --pe: var(--good); }
.feedback.bad { --pe: var(--bad); }
.verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font: 800 1.3rem/1.2 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }
.feedback.good .verdict { color: var(--good); }
.feedback.bad .verdict { color: var(--bad); }
.verdict .ico { height: 22px; animation: pop 0.35s steps(3); }
.verdict small { flex-basis: 100%; font: 600 0.88rem/1.4 var(--font-ui); letter-spacing: 0; text-transform: none; color: var(--ink-2); }
.explain { margin: 14px 0 20px; max-width: 68ch; }
.whys { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; }
.why { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; padding: 12px 14px; background: var(--panel-2); border-left: 4px solid var(--edge); }
.why.ok { border-left-color: var(--good); }
.why.no.picked { border-left-color: var(--bad); }
.why .letter { grid-row: span 3; width: 26px; height: 26px; display: grid; place-items: center; font: 800 0.8rem var(--font-mono); background: var(--bg); color: var(--ink-2); }
.why.ok .letter { background: var(--good); color: var(--on-bright); }
.why.no.picked .letter { background: var(--bad); color: var(--on-bright); }
.why-choice { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.why-code { font: 0.84rem/1.5 var(--font-mono); white-space: pre-wrap; }
.why p { margin: 0; color: var(--ink-2); font-size: 0.92rem; }
.why-tag { justify-self: start; font: 700 0.64rem var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.why.ok .why-tag { color: var(--good); }
.why.no.picked .why-tag { color: var(--bad); }
.feedback-actions { display: flex; justify-content: flex-end; margin-top: 22px; }

/* ---------- results ---------- */
.result-head { text-align: center; padding-block: 12px 4px; }
.result-head h1 { margin: 0; line-height: 0; }
.result-head .ptext { --h: clamp(34px, 9vw, 56px); }
.result-head.win h1 { color: var(--gold); }
.result-head.lose h1 { color: var(--bad); }
.result-head p { color: var(--ink-2); margin: 14px auto 0; max-width: 52ch; }
.big-stars { display: flex; justify-content: center; gap: 12px; margin-top: 18px; }
.big-stars .ico { height: 36px; }
.big-stars > span { color: var(--edge); }
.big-stars > .on { color: var(--gold); animation: pop 0.4s steps(3) both; animation-delay: calc(var(--i) * 0.15s); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 18px; margin-top: 26px; }
.tile { padding: 14px 16px; }
.tile b { display: block; font: 800 1.45rem/1.2 var(--font-mono); font-variant-numeric: tabular-nums; margin-top: 4px; }
.unlock { --pe: var(--gold); margin-top: 26px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.unlock .ico { color: var(--gold); height: 22px; }
.missed { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.missed li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; font-size: 0.92rem; color: var(--ink-2); }
.btn-row { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 28px; }
.btn-row.center { justify-content: center; }

/* ---------- exam ---------- */
.opts { border: 0; padding: 0; margin: 22px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px; }
.opts legend { padding: 0; margin-bottom: 12px; }
.opt { position: relative; display: grid; gap: 2px; padding: 14px 16px; background: var(--panel-2); cursor: pointer; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt b { font: 800 1rem var(--font-mono); }
.opt span { font-size: 0.85rem; color: var(--ink-2); }
.opt.on { --pe: var(--gold); background: var(--gold-bg); }
.opt:focus-within { outline: 3px solid var(--gold); outline-offset: 6px; }
.toggle { display: flex; gap: 12px; align-items: center; margin-top: 22px; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--gold); flex: none; }
.mix { list-style: none; padding: 0; margin: 10px 0 26px; display: grid; gap: 8px; }
.mix li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.mix b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.dot { width: 12px; height: 12px; background: var(--wc); flex: none; }
.exam-controls { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; margin-top: 26px; }
.btn.is-flagged { --pe: var(--gold); color: var(--gold); }
.navgrid { margin-top: 28px; padding: 18px; }
.navcells { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 8px; margin-top: 12px; }
.cell { appearance: none; border: 0; position: relative; height: 42px; cursor: pointer; font: 700 0.85rem var(--font-mono); color: var(--ink-3); background: var(--bg); box-shadow: inset 0 0 0 2px var(--edge); }
.cell.ans { color: var(--ink); background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--ink-3); }
.cell.flag::after { content: ""; position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; background: var(--gold); }
.cell.cur { box-shadow: inset 0 0 0 3px var(--gold); color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-size: 0.8rem; color: var(--ink-3); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; display: inline-block; background: var(--bg); box-shadow: inset 0 0 0 2px var(--edge); }
.legend i.a { background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--ink-3); }
.legend i.f { background: var(--gold); box-shadow: none; }
.submit-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-top: 22px; }
.confirm { margin-top: 22px; padding: 16px; background: var(--panel-2); }
.confirm p { margin: 0 0 14px; }
.score-big { font: 800 clamp(2.4rem, 9vw, 3.6rem)/1 var(--font-mono); font-variant-numeric: tabular-nums; margin-top: 20px; color: var(--ink); }
.rev { margin-top: 18px; }
.rev summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 14px 16px; }
.rev summary::-webkit-details-marker { display: none; }
.rev-n { font: 800 0.85rem var(--font-mono); }
.rev-status { font: 700 0.66rem var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 7px; color: var(--on-bright); background: var(--bad); }
.rev-status.blank { background: var(--ink-3); }
.rev-snip { color: var(--ink-2); font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rev[open] .rev-snip { white-space: normal; }
.rev-body { padding: 0 16px 18px; }
.rev-body .prompt { font-size: 1rem; }

/* ---------- progress ---------- */
.meters { display: grid; gap: 20px; }
.meter-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: end; }
.meter-name { font-weight: 700; }
.meter-name .label { display: block; }
.meter-val { font: 700 0.95rem var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.meter-val small { display: block; font-weight: 400; font-size: 0.75rem; color: var(--ink-3); }
.meter { grid-column: 1 / -1; position: relative; height: 14px; background: var(--bg); box-shadow: inset 0 0 0 2px var(--edge); }
.meter > span { position: absolute; inset: 0 auto 0 0; background: var(--wc, var(--ink-3)); }
.focus-chip { display: inline-block; margin-left: 8px; font: 700 0.62rem var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 6px; background: var(--gold); color: var(--on-bright); vertical-align: 2px; }
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 24px; }
.skill { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 0.9rem; }
.skill .meter { height: 8px; }
.skill b { font: 700 0.85rem var(--font-mono); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--panel-2); white-space: nowrap; }
th { font: 700 0.68rem var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.status-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.status-list li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 0.92rem; }
.status-list .right { font: 0.8rem var(--font-mono); color: var(--ink-2); text-align: right; }

/* ---------- badges ---------- */
.badge-grid { list-style: none; padding: 0; margin: 26px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
.badge { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; padding: 14px; align-items: start; }
.badge-glyph { width: 64px; height: 64px; display: grid; place-items: center; background: var(--bg); color: var(--ink-3); }
.badge-glyph .ptext { --h: 22px; --pt-shadow: transparent; }
.badge.got { --pe: var(--gold); }
.badge.got .badge-glyph { background: var(--gold); color: var(--on-bright); }
.badge b { display: block; }
.badge p { margin: 4px 0 8px; color: var(--ink-2); font-size: 0.86rem; }
.mini { height: 8px; background: var(--bg); box-shadow: inset 0 0 0 2px var(--edge); margin-bottom: 4px; }
.mini > div { height: 100%; background: var(--ink-3); }
.got-tag { font: 700 0.66rem var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }

/* ---------- review + bank ---------- */
.empty-state { text-align: center; padding: 30px 20px; }
.empty-state .sprite { width: 56px; height: 61px; margin: 0 auto 14px; }
.review-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.review-list li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 0.92rem; }
.review-list .snip { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.review-list .times { font: 0.75rem var(--font-mono); color: var(--ink-3); }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; color: var(--ink-2); max-width: 68ch; }
.steps b, .steps code { color: var(--ink); }
.template pre { margin: 0; padding: 14px 16px; font: 500 0.82rem/1.5 var(--font-mono); white-space: pre; }

/* ---------- toasts ---------- */
.toasts { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 14px; right: 14px; z-index: 200; display: grid; justify-items: end; gap: 16px; pointer-events: none; }
.toast { --pe: var(--gold); display: flex; align-items: center; gap: 12px; max-width: 320px; padding: 10px 14px; background: var(--panel); animation: toastIn 0.3s steps(4) both; }
.toast.out { animation: toastOut 0.4s steps(4) forwards; }
.toast b { display: block; font-size: 0.95rem; }
.toast-glyph { background: var(--gold); color: var(--on-bright); padding: 8px; line-height: 0; }
.toast-glyph .ptext { --h: 16px; --pt-shadow: transparent; }

/* ---------- motion ---------- */
@keyframes rise { from { transform: translateY(10px); } to { transform: none; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
@keyframes pop { 0% { transform: scale(0.5); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes hit { 0% { filter: brightness(3); } 30% { transform: translateX(10px); } 60% { filter: brightness(1.8); transform: translateX(-8px); } 100% { filter: none; transform: none; } }
@keyframes lunge { 0% { transform: none; } 45% { transform: translateX(-16px) scale(1.15); } 100% { transform: none; } }
@keyframes heartLost { 0% { transform: scale(1.5); color: var(--ink); } 100% { transform: scale(1); } }
@keyframes flash { 0% { opacity: 0.3; } 100% { opacity: 0; } }
@keyframes toastIn { from { transform: translateY(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateY(-16px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}

/* ---------- small screens ---------- */
@media (min-width: 640px) {
  .node.left { padding-right: 14%; }
  .node.right { padding-left: 14%; }
}
@media (max-width: 560px) {
  .hud { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "quit mode mid" "score score score" "bar bar bar"; }
  .hud-score { text-align: left; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .hud-score .label { display: inline; }
  .qcard { padding: 18px 16px; }
  .prompt { font-size: 1.04rem; }
  .choice { gap: 12px; padding: 12px; }
  .feedback { padding: 18px 16px; }
  .boss { grid-template-columns: 80px minmax(0, 1fr); gap: 14px; }
  .boss-sprite .sprite { width: 80px; height: 80px; }
  .node-card { grid-template-columns: 48px minmax(0, 1fr); gap: 14px; padding: 16px; }
  .node-badge { width: 48px; height: 48px; }
  .node-badge .ptext { --h: 26px; }
  .topbar-title .ptext { --h: 20px; }
  .lock-wrap { margin-left: 0; width: 100%; justify-content: space-between; }
}
@media (max-width: 400px) {
  .menu { grid-template-columns: minmax(0, 1fr); }
  .code-inner { font-size: 0.84rem; }
}
</style>

<noscript><p style="padding:16px">Byte Quest needs JavaScript to run.</p></noscript>
<script>
'use strict';

/* ==================================================================
   BYTE QUEST: an AP Computer Science Principles study game
   ------------------------------------------------------------------
   QUESTION BANK
   Every question lives in the JSON array below. To add one, copy an
   existing question, paste it before the closing ] and edit it.
   (Keep a comma between questions, and none after the last one.)

   Fields
     "id"           unique text, e.g. "w3-20"
     "world"        1 Creative Development   2 Data
                    3 Algorithms and Programming
                    4 Computer Systems and Networks   5 Impact of Computing
     "boss"         true for boss-battle questions (leave out otherwise)
     "tags"         optional labels. These also count toward badges:
                    "binary", "network", "security", "trace",
                    "create-pt", "compression"
     "prompt"       the question. Wrap inline code in `backticks`.
     "code"         optional list of pseudocode lines (line numbers shown)
     "figure"       optional list of text lines for grids and diagrams
     "choices"      the answers. Mark ONE with "correct": true, or mark
                    TWO for a "select two answers" question. Each choice
                    needs "text" (or "code": [lines]) and a "why".
     "explanation"  shown after the question is answered
     "hint"         optional clue for the Hint power-up

   In code you can type <-  !=  >=  <=  and they display as ← ≠ ≥ ≤.
   Answer order is shuffled every time, so never write "both A and B".
   ================================================================== */
const QUESTION_BANK = [
  {
    "id": "w1-01",
    "world": 1,
    "tags": ["collaboration"],
    "prompt": "A team of students is developing an app that recommends books from their school library. Which of the following is the MOST likely benefit of including team members with diverse backgrounds and perspectives?",
    "choices": [
      { "text": "The app is more likely to meet the needs of many different users, because varied perspectives help the team spot needs and problems a less diverse team might miss.", "correct": true, "why": "Collaboration among people with diverse perspectives helps avoid bias and produces innovations that serve a wider audience." },
      { "text": "The app will not need to be tested, because a diverse team will not make programming errors.", "why": "Every program needs testing. No team makeup prevents bugs." },
      { "text": "The app's code will run faster on every device.", "why": "Who is on the team doesn't change how fast the finished code runs." },
      { "text": "The team will no longer need to gather feedback from users.", "why": "User feedback is still essential. A diverse team adds to user research; it doesn't replace it." }
    ],
    "explanation": "The College Board stresses that effective collaboration, especially among people with diverse perspectives, produces computing innovations that reflect a wider range of users and helps avoid bias in the design.",
    "hint": "Think about who ends up using the app."
  },
  {
    "id": "w1-02",
    "world": 1,
    "tags": ["collaboration"],
    "prompt": "In pair programming, two programmers share one computer. Which statement BEST describes how this practice helps during development?",
    "choices": [
      { "text": "One programmer (the driver) writes code while the other (the navigator) reviews each line and thinks ahead, so errors are often caught early.", "correct": true, "why": "The navigator's constant review catches mistakes as they are written, and the partners switch roles regularly." },
      { "text": "Each programmer writes a separate version of the whole program, and the team keeps whichever version is faster.", "why": "That's competing, not pairing. Pair programming is two people working together on the same code." },
      { "text": "It guarantees that the finished program contains no bugs.", "why": "No practice guarantees bug-free code. Pairing reduces errors, but testing is still needed." },
      { "text": "It lets the program run on two computers at once so it finishes faster.", "why": "That describes parallel or distributed computing, which is about running programs, not writing them." }
    ],
    "explanation": "Pair programming is a collaboration model: the driver types, the navigator reviews and plans, and they switch roles. Two sets of eyes on every line catch errors early and spread knowledge across the team.",
    "hint": "Picture two people and one keyboard."
  },
  {
    "id": "w1-03",
    "world": 1,
    "tags": ["development-process"],
    "prompt": "A programmer builds a game by first making the player character move and testing that until it works. Next they add scoring and test it. Only then do they add enemies. Which development process does this describe?",
    "choices": [
      { "text": "Incremental development", "correct": true, "why": "Incremental development breaks the problem into smaller pieces and makes sure each piece works before adding it to the whole." },
      { "text": "Iterative development", "why": "Iterative development means repeatedly refining and revising based on feedback, testing, or reflection, possibly revisiting earlier phases. This scenario is about adding one working piece at a time." },
      { "text": "Event-driven programming", "why": "Event-driven programming describes how code runs (statements triggered by events such as clicks). It is not a development process." },
      { "text": "Pair programming", "why": "Pair programming is a collaboration technique, and this scenario describes one programmer working alone." }
    ],
    "explanation": "Incremental: build and test one piece at a time, then add the next. Iterative: cycle back and refine based on feedback. Real projects often use both, but this scenario is the textbook definition of incremental.",
    "hint": "Focus on the words \"only then.\""
  },
  {
    "id": "w1-04",
    "world": 1,
    "tags": ["program-function"],
    "prompt": "In event-driven programming, which of the following BEST describes an event?",
    "choices": [
      { "text": "An action, such as a key press, a mouse click, or the program starting, that supplies input and triggers part of the program to run.", "correct": true, "why": "Events are associated with actions and supply input data. Code runs when its event is triggered." },
      { "text": "A syntax error that stops the program before it begins running.", "why": "An error is not an event. Events are expected actions that the program responds to." },
      { "text": "A variable that stores the program's final output.", "why": "Variables store values. Events are actions that trigger code." },
      { "text": "The last statement executed in a program that runs from top to bottom.", "why": "Event-driven programs don't simply run top to bottom. Statements run when they are triggered." }
    ],
    "explanation": "In event-driven programming, program statements execute when triggered (by clicks, key presses, timers, and so on) rather than through a fixed sequential flow of control.",
    "hint": "Think about what happens when you tap a button in an app."
  },
  {
    "id": "w1-05",
    "world": 1,
    "tags": ["errors", "trace"],
    "prompt": "The procedure below is intended to return the average of `a` and `b`. For example, `average(4, 8)` should return 6. What kind of error does it contain?",
    "code": [
      "PROCEDURE average(a, b)",
      "{",
      "   RETURN(a + b / 2)",
      "}"
    ],
    "choices": [
      { "text": "A logic error: the program runs, but it computes a + (b / 2), so average(4, 8) returns 8 instead of 6.", "correct": true, "why": "Division happens before addition, so the result is wrong even though nothing crashes. The fix is RETURN((a + b) / 2)." },
      { "text": "A syntax error: the code breaks the rules of the language and cannot run.", "why": "The statement is valid. It runs; it just gives the wrong answer." },
      { "text": "A run-time error: the program stops while it is running.", "why": "Nothing here makes the program crash, the way dividing by zero would." },
      { "text": "An overflow error: the result is too large to store.", "why": "The values are small. Overflow happens when a number exceeds the range the computer can represent." }
    ],
    "explanation": "A logic error is a mistake in the algorithm that makes a program behave incorrectly or unexpectedly. Order of operations matters: `a + b / 2` means `a + (b / 2)`.",
    "hint": "Work it out by hand with a = 4 and b = 8."
  },
  {
    "id": "w1-06",
    "world": 1,
    "tags": ["errors"],
    "prompt": "Which of the following is an example of a syntax error?",
    "choices": [
      { "text": "Typing `DISPLY(score)` instead of `DISPLAY(score)`, so the code doesn't follow the rules of the language.", "correct": true, "why": "A syntax error is a mistake in which the rules of the programming language are not followed, like a misspelled command." },
      { "text": "Dividing by a variable that sometimes equals 0 while the program is running.", "why": "This is a run-time error. It happens during execution, and only for certain values." },
      { "text": "Using `>` when `≥` was needed, so a score of exactly 90 is graded incorrectly.", "why": "This is a logic error. The code is valid, but the algorithm is wrong." },
      { "text": "Adding two numbers whose sum is too large for the number of bits available.", "why": "This is an overflow error." }
    ],
    "explanation": "Know the four error types: syntax (breaks the language's rules), logic (runs but behaves incorrectly), run-time (fails during execution), and overflow (a number outside the range that can be represented).",
    "hint": "Syntax is about spelling and grammar."
  },
  {
    "id": "w1-07",
    "world": 1,
    "tags": ["testing", "trace"],
    "prompt": "A program should display \"A\" for any score of 90 or higher. Which test input would BEST reveal the error in this code?",
    "code": [
      "IF (score > 90)",
      "{",
      "   DISPLAY(\"A\")",
      "}",
      "ELSE",
      "{",
      "   DISPLAY(\"Not A\")",
      "}"
    ],
    "choices": [
      { "text": "90", "correct": true, "why": "90 should earn an A, but 90 > 90 is false, so the code displays \"Not A\". A boundary value exposes the bug." },
      { "text": "95", "why": "95 > 90 is true, so it correctly displays \"A\". This input hides the bug." },
      { "text": "50", "why": "50 correctly displays \"Not A\"." },
      { "text": "100", "why": "100 correctly displays \"A\"." }
    ],
    "explanation": "Good test cases include boundary values: the exact inputs where behavior should change. The fix is `score ≥ 90`.",
    "hint": "Test right at the edge of the condition."
  },
  {
    "id": "w1-08",
    "world": 1,
    "tags": ["documentation"],
    "prompt": "Why do programmers add comments to their code?",
    "choices": [
      { "text": "To explain the purpose and function of code segments, so others (and the author, later) can understand, maintain, and change the code.", "correct": true, "why": "Comments are a form of program documentation. They are written for people and are ignored when the program runs." },
      { "text": "To make the program run faster.", "why": "Comments are ignored during execution, so they have no effect on speed." },
      { "text": "Because a program cannot run unless every line has a comment.", "why": "Comments are optional. The program runs the same with or without them." },
      { "text": "To give the computer extra instructions to execute.", "why": "Comments are not executed at all." }
    ],
    "explanation": "Program documentation, including comments, describes how a program and its code segments work. It helps during development and collaboration, and it doesn't affect how the program runs.",
    "hint": "Who reads a comment: the computer or a person?"
  },
  {
    "id": "w1-09",
    "world": 1,
    "tags": ["documentation", "create-pt"],
    "prompt": "A student uses a procedure written by a classmate in their own program. What should the student do?",
    "choices": [
      { "text": "Acknowledge the classmate as the source of that code segment, for example in a comment or in the program's documentation.", "correct": true, "why": "Code written by someone else, or developed collaboratively, should be credited." },
      { "text": "Rename the variables so the code appears original.", "why": "Disguising someone else's work is plagiarism." },
      { "text": "Nothing, because code written by classmates is automatically in the public domain.", "why": "A classmate's code isn't automatically public domain. Credit the source." },
      { "text": "Remove the procedure, because programs may only contain code the student wrote alone.", "why": "Reusing code is fine and common. It just needs to be acknowledged." }
    ],
    "explanation": "It is important to acknowledge any code segments that were developed collaboratively or by another source. This applies to your Create performance task, too.",
    "hint": "Think about citing sources in an essay."
  },
  {
    "id": "w1-10",
    "world": 1,
    "tags": ["create-pt", "procedures"],
    "prompt": "Consider the code below. Which choice correctly identifies the parameter and the argument?",
    "code": [
      "PROCEDURE doubleIt(num)",
      "{",
      "   RETURN(num * 2)",
      "}",
      "result ← doubleIt(7)"
    ],
    "choices": [
      { "text": "`num` is the parameter; `7` is the argument.", "correct": true, "why": "A parameter is the variable in the procedure definition. An argument is the value passed in when the procedure is called." },
      { "text": "`7` is the parameter; `num` is the argument.", "why": "This is reversed. Parameters appear in the definition; arguments appear in the call." },
      { "text": "`result` is the parameter; `num` is the argument.", "why": "`result` is a variable that stores the returned value. It is neither a parameter nor an argument." },
      { "text": "`doubleIt` is the parameter; `result` is the argument.", "why": "`doubleIt` is the name of the procedure." }
    ],
    "explanation": "Parameters are the input variables of a procedure, listed in its definition. Arguments are the values given to those parameters when the procedure is called. Here, doubleIt(7) sets num to 7 and returns 14.",
    "hint": "One lives in the definition, the other in the call."
  },
  {
    "id": "w1-11",
    "world": 1,
    "tags": ["create-pt", "abstraction"],
    "prompt": "Which of the following BEST explains how a student-developed procedure helps manage complexity in a program?",
    "choices": [
      { "text": "The steps are written once and reused by name, with parameters for different values, so the details are hidden and the code is easier to read, test, and change.", "correct": true, "why": "This is procedural abstraction: you can use the procedure knowing what it does without re-reading how it does it." },
      { "text": "Procedures always make a program use less memory.", "why": "Procedures organize code. They don't guarantee memory savings." },
      { "text": "A procedure guarantees that the program has no logic errors.", "why": "A procedure can contain bugs like any other code. Testing it once does help everywhere it's used, though." },
      { "text": "A procedure allows a program to run without any input.", "why": "Procedures have nothing to do with whether a program takes input." }
    ],
    "explanation": "Procedural abstraction gives a process a name and lets it be used by knowing only what it does, not how. Fix or improve the procedure once and every call benefits. That's the reasoning the Create task asks you to explain.",
    "hint": "What if the same 10 lines were needed in 5 places?"
  },
  {
    "id": "w1-12",
    "world": 1,
    "tags": ["create-pt", "abstraction", "lists"],

function validateBank(list) {
  const ok = [];
  const issues = [];
  const seen = new Set();
  (Array.isArray(list) ? list : []).forEach((q, n) => {
    const where = q && q.id ? `"${q.id}"` : `#${n + 1}`;
    const problems = [];
    if (!q || typeof q !== 'object') problems.push('is not an object');
    else {
      if (!q.id) problems.push('needs an "id"');
      else if (seen.has(q.id)) problems.push('reuses an id that is already taken');
      if (![1, 2, 3, 4, 5].includes(q.world)) problems.push('needs "world" set to 1, 2, 3, 4, or 5');
      if (typeof q.prompt !== 'string' || !q.prompt.trim()) problems.push('needs a "prompt"');
      if (q.code && !Array.isArray(q.code)) problems.push('needs "code" to be a list of lines');
      if (q.figure && !Array.isArray(q.figure)) problems.push('needs "figure" to be a list of lines');
      if (!Array.isArray(q.choices) || q.choices.length < 2 || q.choices.length > LETTERS.length) problems.push(`needs 2 to ${LETTERS.length} "choices"`);
      else {
        const right = q.choices.filter(c => c && c.correct === true).length;
        if (right !== 1 && right !== 2) problems.push('must mark 1 or 2 choices with "correct": true');
        if (right === 2 && q.choices.length < 3) problems.push('needs at least 3 choices for a select-two question');
        if (q.choices.some(c => !c || (typeof c.text !== 'string' && !Array.isArray(c.code)))) problems.push('needs "text" or "code" on every choice');
      }
    }
    if (problems.length) issues.push(`Question ${where} ${problems.join('; ')}.`);
    else { seen.add(q.id); ok.push(q); }
  });
  issues.forEach(m => console.warn('[Byte Quest] Skipped: ' + m));
  return { BANK: ok, BANK_ISSUES: issues };
}

/* ==================================================================

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function prettyOps(s) {
  return String(s).replace(/<-/g, '←').replace(/!=/g, '≠').replace(/>=/g, '≥').replace(/<=/g, '≤');
}
function fmt(s) { // plain text with `inline code`
  return String(s || '').split('`').map((part, i) => (i % 2 ? `<code class="ic">${esc(prettyOps(part))}</code>` : esc(part))).join('').replace(/\n/g, '<br>');
}
function plain(s) { return String(s || '').replace(/`/g, ''); }
function snip(s, n = 110) { const t = plain(s); return t.length > n ? t.slice(0, n - 1) + '…' : t; }
function num(n) { return Number(n).toLocaleString('en-US'); }
function mmss(total) { const m = Math.floor(total / 60); const s = total % 60; return `${m}:${String(s).padStart(2, '0')}`; }
function stat(key) { return state.stats[key] || { a: 0, c: 0 }; }
function pct(s) { return s.a ? Math.round((100 * s.c) / s.a) : null; }
function level() { return 1 + Math.floor(state.xp / 1000); }
function multiplier(streak) { return streak >= 10 ? 4 : streak >= 5 ? 3 : streak >= 3 ? 2 : 1; }
function worldOf(id) { return WORLDS[id - 1]; }
function current() { return run ? run.queue[run.index] : null; }
function needCount(item) { return item.multi ? 2 : 1; }
function isAnswered(item) { return item.selected.size === needCount(item); }
function reducedMotion() { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
function examMinutes(n) { return Math.round(n * CONFIG.examMinutesPerQuestion); }

/* ---------- pixel renderers ---------- */
function pixelText(text, { cls = '', label = text, gradient = false } = {}) {
  let x = 0;
  let d = '';
  for (const ch of String(text).toUpperCase()) {
    const rows = (FONT[ch] || FONT['?']).split(',');
    rows.forEach((row, y) => {
      for (let i = 0; i < row.length; i++) if (row[i] === '1') d += `M${x + i} ${y}h1v1h-1z`;
    });
    x += rows[0].length + 1;
  }
  const w = Math.max(x, 2); // glyph width plus room for the 1px drop shadow
  const fill = gradient ? 'url(#logoGrad)' : 'currentColor';
  const defs = gradient
    ? `<defs><linearGradient id="logoGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="7">
        <stop offset="0" stop-color="#ffd447"/><stop offset="0.2857" stop-color="#ffd447"/>
        <stop offset="0.2857" stop-color="#ffa53a"/><stop offset="0.5714" stop-color="#ffa53a"/>
        <stop offset="0.5714" stop-color="#ff6fae"/><stop offset="0.8571" stop-color="#ff6fae"/>
        <stop offset="0.8571" stop-color="#b08cff"/><stop offset="1" stop-color="#b08cff"/></linearGradient></defs>`
    : '';
  return `<svg class="ptext ${cls}" style="--pw:${w}" viewBox="0 0 ${w} 8" shape-rendering="crispEdges" ${label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"'}>${defs}<path class="pt-sh" transform="translate(1 1)" d="${d}"/><path class="pt-fg" style="fill:${fill}" d="${d}"/></svg>`;
}
function icon(name, cls = '') {
  const rows = ICONS[name];
  let d = '';
  rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) if (row[x] === '1') d += `M${x} ${y}h1v1h-1z`; });
  return `<svg class="ico ${cls}" style="--iw:${rows[0].length};--ih:${rows.length}" viewBox="0 0 ${rows[0].length} ${rows.length}" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="${d}"/></svg>`;
}
function sprite(name, palette = {}) {
  const rows = SPRITES[name];
  const colors = { ...SPRITE_COLORS, ...palette };
  const paths = {};
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') (paths[ch] = paths[ch] || []).push(`M${x} ${y}h1v1h-1z`); }));
  const body = Object.entries(paths).map(([ch, parts]) => `<path fill="${colors[ch] || '#ffffff'}" d="${parts.join('')}"/>`).join('');
  return `<svg class="sprite" viewBox="0 0 ${rows[0].length} ${rows.length}" shape-rendering="crispEdges" aria-hidden="true">${body}</svg>`;
}
function bossSprite(worldId) {
  const w = worldOf(worldId);
  return sprite('boss' + worldId, { m: w.hex, d: w.dark });
}
function starRow(n, cls = 'stars') {
  let s = '';
  for (let i = 0; i < 3; i++) s += `<span class="${i < n ? 'on' : ''}" style="--i:${i}">${icon('star')}</span>`;
  return `<span class="${cls}" role="img" aria-label="${n} of 3 stars">${s}</span>`;
}

/* ---------- code blocks ---------- */
const KEYWORDS = new Set(['IF', 'ELSE', 'REPEAT', 'TIMES', 'UNTIL', 'FOR', 'EACH', 'IN', 'PROCEDURE', 'RETURN', 'NOT', 'AND', 'OR', 'MOD']);
const BUILTINS = new Set(['DISPLAY', 'INPUT', 'RANDOM', 'APPEND', 'INSERT', 'REMOVE', 'LENGTH', 'MOVE_FORWARD', 'ROTATE_LEFT', 'ROTATE_RIGHT', 'CAN_MOVE']);
function highlight(line) {
  const src = prettyOps(line);
  const re = /("[^"]*")|(\d+(?:\.\d+)?)|([A-Za-z_][A-Za-z0-9_]*)|(←)|([\s\S])/gu;
  let out = '';
  let m;
  while ((m = re.exec(src))) {
    const [t, str, number, word, arrow] = m;
    if (str) out += `<span class="t-str">${esc(str)}</span>`;
    else if (number) out += `<span class="t-num">${t}</span>`;
    else if (word) {
      if (KEYWORDS.has(word)) out += `<span class="t-kw">${word}</span>`;
      else if (BUILTINS.has(word)) out += `<span class="t-fn">${word}</span>`;
      else if (word === 'true' || word === 'false') out += `<span class="t-num">${word}</span>`;
      else out += esc(word);
    } else if (arrow) out += '<span class="t-op">←</span>';
    else out += esc(t);
  }
  return out;
}
function codeBlock(lines, { numbers = true, small = false } = {}) {
  const body = lines.map((l, i) => `<span class="ln">${numbers ? `<span class="ln-n" aria-hidden="true">${i + 1}</span>` : ''}<span class="ln-c">${highlight(l) || ' '}</span></span>`).join('');
  return `<span class="code ${small ? 'code-sm' : ''}" role="group" aria-label="Code"><span class="code-inner">${body}</span></span>`;
}
function figureBlock(lines) {
  return `<div class="code figure"><pre>${esc(prettyOps(lines.join('\n')))}</pre></div>`;
}

/* ==================================================================
   STATS, REWARDS, BADGES
   ================================================================== */
function bump(key, ok) {
  const s = state.stats[key] || (state.stats[key] = { a: 0, c: 0 });
  s.a++;
  if (ok) s.c++;
}
function record(q, ok, multi) {
  bump('all', ok);
  bump('w' + q.world, ok);
  (q.tags || []).forEach(t => bump('tag:' + t, ok));
  const qs = state.qstats[q.id] || (state.qstats[q.id] = { a: 0, c: 0 });
  qs.a++;
  if (ok) qs.c++;
  if (ok && multi) state.count.twoCorrect++;
}
function addMistake(id) { state.mistakes = [id, ...state.mistakes.filter(x => x !== id)]; }
function removeMistake(id) { state.mistakes = state.mistakes.filter(x => x !== id); }
function grantPowerup(kind) {
  const keys = Object.keys(POWERUPS);
  const k = kind || keys[Math.floor(Math.random() * keys.length)];
  state.powerups[k]++;
  toast('Power-up found', `+1 ${POWERUPS[k].name}`, '+1');
}
function checkBadges() {
  BADGES.forEach(b => {
    if (state.badges[b.id]) return;
    if (b.value(state) >= b.goal) {
      state.badges[b.id] = Date.now();
      toast('Badge unlocked', b.name, b.glyph);
    }
  });
}
function checkLevel(before) {
  if (level() > before) toast('Level up', `You reached LV ${level()}`, 'LV');
}
function toast(title, body, glyph) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${glyph ? `<div class="toast-glyph">${pixelText(glyph, { label: '' })}</div>` : ''}<div><span class="label">${esc(title)}</span><b>${esc(body)}</b></div>`;
  toastBox.appendChild(el);
  setTimeout(() => el.classList.add('out'), 3200);
  setTimeout(() => el.remove(), 3700);
}

/* ==================================================================
   RUNS: stage, boss, review, exam
   ================================================================== */
function prepare(q, extra = {}) {
  return {
    q,
    choices: shuffle(q.choices.map(c => ({ ...c }))),
    multi: q.choices.filter(c => c.correct === true).length === 2,
    selected: new Set(),
    removed: new Set(),
    hintUsed: false,
    fiftyUsed: false,
    flagged: false,
    done: false,
    result: null,
    ...extra,
  };
}
function isCorrect(item) {
  const want = item.choices.map((c, i) => (c.correct === true ? i : -1)).filter(i => i >= 0);
  return want.length === item.selected.size && want.every(i => item.selected.has(i));
}
function newRun(mode, world, questions) {
  return {
    mode, world,
    queue: questions.map(q => prepare(q)),
    index: 0,
    lives: mode === 'review' ? Infinity : CONFIG.lives,
    maxLives: CONFIG.lives,
    livesLost: 0,
    streak: 0,
    runBest: 0,
    xp: 0,
    correct: 0,
    wrong: 0,
    skipped: 0,
    usedPowerup: false,
    missed: [],
    fixed: 0,
    bossHP: 0,
    bossMax: 0,
    won: false,
  };
}
function startStage(w) {
  const pool = BANK.filter(q => q.world === w && !q.boss);
  if (!pool.length) return toast('No questions yet', `Add questions with "world": ${w} to the bank.`);
  run = newRun('stage', w, shuffle(pool).slice(0, CONFIG.stageSize));
  state.lastWorld = w;
  go('play');
}
function startBoss(w) {
  if (!state.world[w].stageCleared) return;
  const pool = BANK.filter(q => q.world === w && q.boss);
  if (!pool.length) return toast('No boss questions yet', `Add questions with "boss": true to world ${w}.`);
  run = newRun('boss', w, shuffle(pool).slice(0, CONFIG.bossSize));
  run.bossHP = run.bossMax = run.queue.length;
  state.lastWorld = w;
  go('play');
}
function startReview() {
  const qs = state.mistakes.map(id => QBYID.get(id)).filter(Boolean);
  if (!qs.length) return go('review-setup');
  run = newRun('review', null, shuffle(qs));
  go('play');
}
function leaveRun() {
  stopTimer();
  run = null;
  ui.confirmSubmit = false;
  ui.quitArmed = false;
}

function pick(i) {
  const item = current();
  if (!item || item.removed.has(i) || (item.done && run.mode !== 'exam')) return;
  if (item.multi) {
    if (item.selected.has(i)) item.selected.delete(i);
    else if (item.selected.size < 2) item.selected.add(i);
    else {
      const chip = document.getElementById('chipTwo');
      if (chip) { chip.classList.remove('nudge'); void chip.offsetWidth; chip.classList.add('nudge'); }
      return;
    }
  } else if (run.mode === 'exam' && item.selected.has(i)) {
    item.selected.clear();
  } else {
    item.selected.clear();
    item.selected.add(i);
  }
  refreshChoices();
}
function refreshChoices() {
  const item = current();
  const exam = run.mode === 'exam';
  document.querySelectorAll('.choice').forEach(btn => {
    const i = Number(btn.dataset.i);
    btn.className = 'choice ' + choiceState(item, i, exam);
    btn.setAttribute('aria-pressed', String(item.selected.has(i)));
  });
  const lock = document.getElementById('lockBtn');
  if (lock) lock.disabled = !isAnswered(item);
  const need = document.getElementById('needTxt');
  if (need) need.textContent = needText(item);
  if (exam) {
    const cell = document.querySelector(`.cell[data-i="${run.index}"]`);
    if (cell) cell.classList.toggle('ans', isAnswered(item));
    const count = document.getElementById('answeredCount');
    if (count) count.textContent = `${run.queue.filter(isAnswered).length} / ${run.queue.length}`;
  }
}
function needText(item) {
  if (!item.multi) return item.selected.size ? 'Ready' : 'Pick one answer';
  return item.selected.size === 2 ? 'Ready' : `Pick two answers (${item.selected.size} of 2)`;
}

function usePowerup(k) {
  const item = current();
  const r = run;
  if (!item || item.done || r.mode === 'boss' || r.mode === 'exam' || !(state.powerups[k] > 0)) return;
  if (k === 'fifty') {
    if (item.multi || item.fiftyUsed || wrongLeft(item).length < 3) return;
    shuffle(wrongLeft(item)).slice(0, 2).forEach(i => { item.removed.add(i); item.selected.delete(i); });
    item.fiftyUsed = true;
  } else if (k === 'hint') {
    if (!item.q.hint || item.hintUsed) return;
    item.hintUsed = true;
  } else if (k === 'skip') {
    state.powerups.skip--;
    r.usedPowerup = true;
    r.skipped++;
    item.skipped = true;
    return advance();
  }
  state.powerups[k]--;
  r.usedPowerup = true;
  render();
}
function wrongLeft(item) {
  return item.choices.map((c, i) => (c.correct !== true && !item.removed.has(i) ? i : -1)).filter(i => i >= 0);
}

function lockIn() {
  const r = run;
  const item = current();
  if (!item || item.done || r.mode === 'exam' || !isAnswered(item)) return;
  const before = level();
  const ok = isCorrect(item);
  item.done = true;
  item.result = ok ? 'correct' : 'wrong';
  if (!item.retry) record(item.q, ok, item.multi);
  if (ok) {
    r.correct++;
    r.streak++;
    r.runBest = Math.max(r.runBest, r.streak);
    state.bestStreak = Math.max(state.bestStreak, r.streak);
    item.mult = multiplier(r.streak);
    item.xp = Math.round(CONFIG.xp[r.mode] * item.mult * (item.hintUsed ? 0.5 : 1));
    r.xp += item.xp;
    state.xp += item.xp;
    if (r.mode === 'boss') { r.bossHP = Math.max(0, r.bossHP - 1); ui.fx = 'hit'; }
    if (r.mode === 'review') { removeMistake(item.q.id); r.fixed++; state.count.reviewFixed++; }
    if (r.streak % 5 === 0) grantPowerup();
  } else {
    r.wrong++;
    r.streak = 0;
    addMistake(item.q.id);
    if (!r.missed.includes(item.q)) r.missed.push(item.q);
    if (r.mode !== 'review') { r.lives--; r.livesLost++; ui.fx = 'hurt'; }
    if (r.mode === 'boss' && r.lives > 0) r.queue.push(prepare(item.q, { retry: true }));
  }
  checkLevel(before);
  checkBadges();
  render();
  ui.fx = null;
  const fb = document.getElementById('feedback');
  if (fb) {
    fb.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn) nextBtn.focus({ preventScroll: true });
  }
}
function advance() {
  const r = run;
  if (r.mode !== 'review' && r.lives <= 0) return finish(false);
  if (r.mode === 'boss' && r.bossHP <= 0) return finish(true);
  r.index++;
  if (r.index >= r.queue.length) return finish(r.mode === 'boss' ? r.bossHP <= 0 : true);
  ui.fx = null;
  render();
  const card = document.querySelector('.qcard');
  if (card) card.classList.add('enter');
  window.scrollTo(0, 0);
  const p = document.getElementById('qprompt');
  if (p) p.focus({ preventScroll: true });
}
function finish(won) {
  const r = run;
  r.won = won;
  if (r.world && won) {
    const ws = state.world[r.world];
    r.stars = Math.max(1, 3 - r.livesLost);
    if (r.mode === 'stage') {
      r.firstClear = !ws.stageCleared;
      ws.stageCleared = true;
      ws.stageStars = Math.max(ws.stageStars, r.stars);
      if (r.livesLost === 0) state.count.flawless++;
      if (r.lives === 1) state.count.clutch++;
      if (!r.usedPowerup) state.count.purist++;
      grantPowerup();
    } else if (r.mode === 'boss') {
      r.firstClear = !ws.bossDefeated;
      ws.bossDefeated = true;
      ws.bossStars = Math.max(ws.bossStars, r.stars);
      Object.keys(POWERUPS).forEach(k => { state.powerups[k]++; });
      toast('Boss loot', '+1 of every power-up', '+3');
    }
  }
  checkBadges();
  go('result');
}
function quit(btn) {
  if (!ui.quitArmed) {

/* ---------- exam mode ---------- */
function examPlan(n) {
  const pools = WORLDS.map(w => BANK.filter(q => q.world === w.id));
  const mids = WORLDS.map(w => (w.weight[0] + w.weight[1]) / 2);
  const totalWeight = mids.reduce((a, b) => a + b, 0);
  const raw = mids.map(m => (n * m) / totalWeight);
  const counts = raw.map(Math.floor);
  let left = n - counts.reduce((a, b) => a + b, 0);
  raw.map((v, i) => [v - Math.floor(v), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0) { counts[i]++; left--; } });
  let over = 0;
  counts.forEach((c, i) => { if (c > pools[i].length) { over += c - pools[i].length; counts[i] = pools[i].length; } });
  const byWeight = mids.map((m, i) => [m, i]).sort((a, b) => b[0] - a[0]).map(x => x[1]);
  while (over > 0) {
    let placed = false;
    for (const i of byWeight) if (over > 0 && counts[i] < pools[i].length) { counts[i]++; over--; placed = true; }
    if (!placed) break;
  }
  return { counts, pools };
}
function startExam(n, timed) {
  const { counts, pools } = examPlan(n);
  const picked = shuffle(pools.flatMap((pool, i) => shuffle(pool).slice(0, counts[i])));
  if (!picked.length) return toast('No questions yet', 'Add questions to the bank first.');
  run = newRun('exam', null, picked);
  run.timeLimit = timed ? examMinutes(picked.length) * 60 : 0;
  run.timeLeft = run.timeLimit;
  run.startedAt = Date.now();
  ui.confirmSubmit = false;
  startTimer();
  go('exam');
}
function startTimer() {
  stopTimer();
  if (!run || !run.timeLimit) return;
  run.deadline = Date.now() + run.timeLeft * 1000;
  timerId = setInterval(tick, 1000);
}
function stopTimer() { clearInterval(timerId); timerId = 0; }
function tick() {
  if (!run || run.mode !== 'exam') return stopTimer();
  run.timeLeft = Math.max(0, Math.round((run.deadline - Date.now()) / 1000));
  const el = document.getElementById('timer');
  if (el) { el.textContent = mmss(run.timeLeft); el.classList.toggle('low', run.timeLeft <= 300); }
  if (run.timeLeft <= 0) submitExam(true);
}
function examGo(i) {
  if (!run || i < 0 || i >= run.queue.length) return;
  run.index = i;
  ui.confirmSubmit = false;
  render();
  window.scrollTo(0, 0);
  const p = document.getElementById('qprompt');
  if (p) p.focus({ preventScroll: true });
}
function submitExam(timedOut) {
  const r = run;
  if (!r || r.mode !== 'exam' || r.submitted) return;
  stopTimer();
  r.submitted = true;
  r.timedOut = !!timedOut;
  const before = level();
  r.perWorld = {};
  WORLDS.forEach(w => { r.perWorld[w.id] = { c: 0, t: 0 }; });
  r.correct = 0;
  r.queue.forEach(item => {
    const ok = isAnswered(item) && isCorrect(item);
    item.done = true;
    item.result = ok ? 'correct' : item.selected.size ? 'wrong' : 'blank';
    record(item.q, ok, item.multi);
    r.perWorld[item.q.world].t++;
    if (ok) { r.correct++; r.perWorld[item.q.world].c++; } else addMistake(item.q.id);
  });
  const n = r.queue.length;
  r.xp = r.correct * CONFIG.xp.exam;
  state.xp += r.xp;
  r.secondsUsed = r.timeLimit ? r.timeLimit - r.timeLeft : Math.round((Date.now() - r.startedAt) / 1000);
  state.exams.unshift({ at: Date.now(), n, correct: r.correct, timed: !!r.timeLimit, seconds: r.secondsUsed });
  if (n >= 30 && r.correct / n >= 0.8) state.count.examReady++;
  if (n >= 45) state.count.marathon++;
  checkLevel(before);
  checkBadges();
  ui.confirmSubmit = false;
  go('exam-result');
}

    const left = state.mistakes.filter(id => QBYID.has(id)).length;
    title = 'REVIEW DONE';
    line = `You fixed ${r.fixed} question${r.fixed === 1 ? '' : 's'}. ${left ? `${left} still on your list.` : 'Your review list is empty.'}`;
    buttons = `${left ? `<button type="button" class="btn btn-primary" data-act="review">${icon('play')}<span>Review again</span></button>` : ''}
      <button type="button" class="btn" data-act="map">World map</button>
      <button type="button" class="btn btn-ghost" data-act="home">Menu</button>`;
  }
  const stars = r.won && r.mode !== 'review' ? starRow(r.stars, 'big-stars') : '';
  const missed = r.missed.length
    ? `<section class="card px"><h2>Missed this run</h2><ul class="missed">${r.missed.map(q => `<li><span class="dot" style="--wc:${worldOf(q.world).color};margin-top:6px"></span><span>${esc(snip(q.prompt, 140))}</span></li>`).join('')}</ul></section>`
    : '';
  return `<section class="screen">
    <div class="result-head ${r.won ? 'win' : 'lose'}">
      <h1>${pixelText(title)}</h1>
      ${stars}
      <p>${line}</p>
    </div>
    <div class="tiles">
      <div class="tile px"><span class="label">Correct</span><b>${r.correct} / ${answered}</b></div>
      <div class="tile px"><span class="label">Accuracy</span><b>${answered ? acc + '%' : '–'}</b></div>
      <div class="tile px"><span class="label">XP earned</span><b>+${num(r.xp)}</b></div>
      <div class="tile px"><span class="label">Best streak</span><b>${r.runBest}</b></div>
    </div>
    ${unlock}
    ${missed}
    <div class="btn-row center">${buttons}</div>
  </section>`;
}

/* ---------- exam screens ---------- */
function renderExamSetup() {
  if (!BANK.length) return `<section class="screen">${topbar('EXAM MODE')}<div class="card px"><p class="lead">The question bank is empty. Add questions to QUESTION_BANK and reload.</p></div></section>`;
  const sizes = CONFIG.examSizes.filter(n => n <= BANK.length);
  if (!sizes.length && BANK.length) sizes.push(BANK.length);
  if (!sizes.includes(ui.examSize)) ui.examSize = sizes[Math.min(1, sizes.length - 1)];
  const plan = examPlan(ui.examSize);
  const last = state.exams[0];
  return `<section class="screen">
    ${topbar('EXAM MODE')}
    <div class="card px">
      <p class="lead">Questions from all five Big Ideas, mixed and weighted like the real AP exam. Like test day, you get no lives, no power-ups, and no feedback until you submit. You can flag questions and jump around.</p>
      <fieldset class="opts">
        <legend class="label">Length</legend>
        ${sizes.map(n => `<label class="opt ${n === ui.examSize ? 'on' : ''}"><input type="radio" name="examSize" value="${n}" ${n === ui.examSize ? 'checked' : ''}><b>${n} questions</b><span>${examMinutes(n)} minutes</span></label>`).join('')}
      </fieldset>
      <label class="toggle"><input type="checkbox" id="examTimed" ${ui.examTimed ? 'checked' : ''}><span>Timed at real exam pace: 70 questions in 120 minutes, about 1.7 minutes each.</span></label>
      <h2 class="label" style="margin-top:26px">Question mix</h2>
      <ul class="mix">${WORLDS.map((w, i) => `<li style="--wc:${w.color}"><span class="dot"></span><span>${w.name} <span class="muted">(${w.weight[0]}–${w.weight[1]}%)</span></span><b>${plan.counts[i]}</b></li>`).join('')}</ul>
      <button type="button" class="btn btn-primary btn-big" data-act="exam-start">${icon('play')}<span>Start exam</span></button>
    </div>
    ${last ? `<p class="muted" style="margin-top:22px">Last exam: ${last.correct} / ${last.n} (${Math.round((100 * last.correct) / last.n)}%). Full history is on the Progress screen.</p>` : ''}
  </section>`;
}
function renderExam() {
  const r = run;
  if (!r) return renderExamSetup();
  const item = current();
  const answered = r.queue.filter(isAnswered).length;
  const unanswered = r.queue.length - answered;
  const flagged = r.queue.filter(it => it.flagged).length;
  const cells = r.queue.map((it, i) => `<button type="button" class="cell ${isAnswered(it) ? 'ans' : ''} ${it.flagged ? 'flag' : ''} ${i === r.index ? 'cur' : ''}" data-act="exam-go" data-i="${i}" aria-label="Question ${i + 1}${isAnswered(it) ? ', answered' : ''}${it.flagged ? ', flagged' : ''}" ${i === r.index ? 'aria-current="true"' : ''}>${i + 1}</button>`).join('');
  const submit = ui.confirmSubmit
    ? `<div class="confirm" role="alertdialog" aria-label="Submit exam">
        <p>${unanswered ? `<b>${unanswered} unanswered</b>` : 'Every question is answered'}${flagged ? ` and <b>${flagged} flagged</b>` : ''}. Submit now? You can't change answers afterward.</p>
        <div class="btn-row" style="margin-top:0"><button type="button" class="btn" data-act="exam-cancel">Keep working</button><button type="button" class="btn btn-primary" data-act="exam-confirm">Submit exam</button></div>
      </div>`
    : `<div class="submit-row"><span class="muted">${answered} of ${r.queue.length} answered</span><button type="button" class="btn btn-primary" data-act="exam-submit">Review and submit</button></div>`;
  return `<section class="screen">
    <div class="hud px">
      <button type="button" class="btn btn-ghost btn-sm" data-act="quit">Quit</button>
      <div class="hud-mode"><span class="label">Exam mode</span><b>Q ${r.index + 1} / ${r.queue.length}</b></div>
      <div class="hud-timer">${r.timeLimit ? `<span class="label">Time left</span><b id="timer" class="${r.timeLeft <= 300 ? 'low' : ''}">${mmss(r.timeLeft)}</b>` : '<span class="label">Untimed</span><b>–</b>'}</div>
      <div class="hud-score"><span class="label">Answered</span><b id="answeredCount">${answered} / ${r.queue.length}</b></div>
    </div>
    ${questionCard(item, { exam: true })}
    <div class="exam-controls">
      <button type="button" class="btn" data-act="exam-prev" ${r.index === 0 ? 'disabled' : ''}>${icon('back')}<span>Prev</span></button>
      <button type="button" class="btn ${item.flagged ? 'is-flagged' : ''}" data-act="exam-flag" aria-pressed="${item.flagged}">${icon('flag')}<span>${item.flagged ? 'Flagged' : 'Flag for review'}</span></button>
      <button type="button" class="btn btn-world" style="--wc:var(--ink-2)" data-act="exam-next" ${r.index === r.queue.length - 1 ? 'disabled' : ''}><span>Next</span>${icon('play')}</button>
    </div>

      <h2 class="label">Question navigator</h2>
      <div class="navcells">${cells}</div>
      <div class="legend"><span><i></i>Unanswered</span><span><i class="a"></i>Answered</span><span><i class="f"></i>Flagged</span></div>
      ${submit}
    </section>
  </section>`;
}
function renderExamResult() {
  const r = run;
  if (!r || !r.submitted) return renderExamSetup();
  const n = r.queue.length;
  const p = Math.round((100 * r.correct) / n);
  const rows = WORLDS.filter(w => r.perWorld[w.id].t).map(w => {
    const s = r.perWorld[w.id];
    const wp = Math.round((100 * s.c) / s.t);
    return `<div class="meter-row" style="--wc:${w.color}">
      <div class="meter-name">${w.name}</div>
      <div class="meter-val">${wp}%<small>${s.c} of ${s.t}</small></div>
      <div class="meter" role="img" aria-label="${w.name}: ${wp}%"><span style="width:${wp}%"></span></div>
    </div>`;
  }).join('');
  const misses = r.queue.map((it, i) => ({ it, i })).filter(x => x.it.result !== 'correct');
  const review = misses.map(({ it, i }) => {
    const q = it.q;
    return `<details class="rev px" style="--wc:${worldOf(q.world).color}">
      <summary><span class="rev-n">Q${i + 1}</span><span class="rev-status ${it.result === 'blank' ? 'blank' : ''}">${it.result === 'blank' ? 'Blank' : 'Missed'}</span><span class="rev-snip">${esc(snip(q.prompt, 90))}</span></summary>
      <div class="rev-body">
        <div class="chips"><span class="chip chip-world">Big Idea ${q.world} · ${worldOf(q.world).short}</span>${it.multi ? '<span class="chip chip-two">Select two answers</span>' : ''}</div>

  return `<section class="screen">
    ${topbar('EXAM RESULTS')}
    <div class="result-head ${p >= 70 ? 'win' : 'lose'}">
      <div class="score-big">${r.correct} / ${n}</div>
      <p>${p}% correct${r.timeLimit ? ` in ${mmss(r.secondsUsed)} of ${mmss(r.timeLimit)}` : ` in ${mmss(r.secondsUsed)}`}${r.timedOut ? '. Time ran out, so the exam was submitted automatically.' : '.'} You earned +${num(r.xp)} XP. Missed questions were added to Review Mistakes.</p>
    </div>
    <section class="card px"><h2>By Big Idea</h2><div class="meters">${rows}</div></section>
    ${misses.length ? `<h2 class="section-title" style="margin-top:32px">Questions to review (${misses.length})</h2>${review}` : '<section class="card px"><h2>Perfect score</h2><p class="lead">You answered every question correctly.</p></section>'}
    <div class="btn-row center">
      <button type="button" class="btn btn-primary" data-act="exam-setup">${icon('play')}<span>New exam</span></button>
      ${misses.length ? '<button type="button" class="btn" data-act="review">Review mistakes</button>' : ''}
      <button type="button" class="btn btn-ghost" data-act="home">Menu</button>
    </div>
  </section>`;
}

function renderProgress() {
  const all = stat('all');
  const rows = WORLDS.map(w => ({ w, s: stat('w' + w.id) }));
  const ranked = rows.filter(x => x.s.a >= 3).sort((a, b) => a.s.c / a.s.a - b.s.c / b.s.a);
  const weakest = ranked.length >= 2 ? ranked[0] : null;
  const meters = rows.map(({ w, s }) => {
    const p = pct(s);
    return `<div class="meter-row" style="--wc:${w.color}">
      <div class="meter-name"><span class="label">Big Idea ${w.id} · ${w.weight[0]}–${w.weight[1]}% of exam</span>${w.name}${weakest && weakest.w.id === w.id ? '<span class="focus-chip">Focus here</span>' : ''}</div>
      <div class="meter-val">${p === null ? '–' : p + '%'}<small>${s.a ? `${s.c} of ${s.a}` : 'not started'}</small></div>
      <div class="meter" role="img" aria-label="${w.name}: ${p === null ? 'no answers yet' : p + '% correct'}"><span style="width:${p || 0}%"></span></div>
    </div>`;
  }).join('');
  const tags = Object.keys(state.stats).filter(k => k.startsWith('tag:')).map(k => ({ tag: k.slice(4), s: state.stats[k] }))
    .sort((a, b) => a.s.c / a.s.a - b.s.c / b.s.a || b.s.a - a.s.a);
  const skills = tags.map(({ tag, s }) => {
    const p = pct(s);
    return `<div class="skill"><span>${esc(TAG_LABELS[tag] || tag)}</span><b>${p}% <span class="muted">(${s.c}/${s.a})</span></b><div class="meter"><span style="width:${p}%"></span></div></div>`;
  }).join('');
  const status = WORLDS.map(w => {
    const ws = state.world[w.id];
    return `<li style="--wc:${w.color}"><span class="dot"></span><span>${w.name}</span><span class="right">${ws.stageCleared ? `Stage ${starRow(ws.stageStars)}` : 'Stage not cleared'} · ${ws.bossDefeated ? 'Boss defeated' : ws.stageCleared ? 'Boss unlocked' : 'Boss locked'}</span></li>`;
  }).join('');
  const exams = state.exams.map(e => `<tr><td>${new Date(e.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</td><td>${e.n}</td><td>${e.correct}</td><td>${Math.round((100 * e.correct) / e.n)}%</td><td>${mmss(e.seconds)}${e.timed ? '' : ' (untimed)'}</td></tr>`).join('');
  return `<section class="screen">
    ${topbar('PROGRESS')}
    <div class="tiles">
      <div class="tile px"><span class="label">Level</span><b>${level()}</b></div>
      <div class="tile px"><span class="label">Total XP</span><b>${num(state.xp)}</b></div>
      <div class="tile px"><span class="label">Accuracy</span><b>${pct(all) === null ? '–' : pct(all) + '%'}</b></div>
      <div class="tile px"><span class="label">Answered</span><b>${num(all.a)}</b></div>
      <div class="tile px"><span class="label">Best streak</span><b>${state.bestStreak}</b></div>
      <div class="tile px"><span class="label">Badges</span><b>${Object.keys(state.badges).length} / ${BADGES.length}</b></div>
    </div>
    <section class="card px">
      <h2>Accuracy by Big Idea</h2>
      <div class="meters">${meters}</div>
      ${weakest
        ? `<div class="btn-row"><button type="button" class="btn btn-world" style="--wc:${weakest.w.color}" data-act="stage" data-w="${weakest.w.id}">${icon('play')}<span>Practice ${weakest.w.short}</span></button>${state.mistakes.length ? '<button type="button" class="btn" data-act="review">Review mistakes</button>' : ''}</div>`
        : '<p class="muted" style="margin:18px 0 0">Answer at least 3 questions in two or more Big Ideas to see which one needs the most work.</p>'}
    </section>
    <section class="card px">
      <h2>Skills, weakest first</h2>
      ${skills ? `<div class="skills">${skills}</div>` : '<p class="muted" style="margin:0">Skill-level accuracy (binary, code tracing, protocols, and more) shows up after your first answers.</p>'}
    </section>
    <section class="card px"><h2>World status</h2><ul class="status-list">${status}</ul></section>
    <section class="card px"><h2>Exam history</h2>
      ${exams ? `<div class="table-wrap"><table><thead><tr><th>Time</th><th>Questions</th><th>Correct</th><th>Score</th><th>Time used</th></tr></thead><tbody>${exams}</tbody></table></div>` : '<p class="muted" style="margin:0">No exams yet. Exam Mode mixes all five Big Ideas at real exam pace.</p>'}

  </section>`;

function renderBadges() {

   INPUT
   ================================================================== */
const ACTIONS = {
  home: () => { leaveRun(); go('home'); },
  map: () => { leaveRun(); go('map'); },
  'exam-setup': () => { leaveRun(); go('exam-setup'); },
  'review-setup': () => { leaveRun(); go('review-setup'); },
  progress: () => go('progress'),
  badges: () => go('badges'),
  bank: () => go('bank'),
  stage: el => { leaveRun(); startStage(Number(el.dataset.w)); },
  boss: el => { leaveRun(); startBoss(Number(el.dataset.w)); },
  review: () => { leaveRun(); startReview(); },
  pick: el => pick(Number(el.dataset.i)),
  lock: () => lockIn(),
  next: () => advance(),
  pu: el => usePowerup(el.dataset.k),
  quit: el => quit(el),
  'exam-start': () => startExam(ui.examSize, ui.examTimed),
  'exam-prev': () => examGo(run.index - 1),
  'exam-next': () => examGo(run.index + 1),
  'exam-go': el => examGo(Number(el.dataset.i)),
  'exam-flag': () => { const it = current(); it.flagged = !it.flagged; render(); },
  'exam-submit': () => { ui.confirmSubmit = true; render(); const c = document.querySelector('[data-act="exam-confirm"]'); if (c) c.focus(); },
  'exam-cancel': () => { ui.confirmSubmit = false; render(); },
  'exam-confirm': () => submitExam(false),
  'copy-template': el => {
    const done = () => { el.textContent = 'Copied'; setTimeout(() => { if (el.isConnected) el.textContent = 'Copy template'; }, 1800); };
    const fallback = () => {
      const pre = document.getElementById('tpl');
      const range = document.createRange();
      range.selectNodeContents(pre);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      el.textContent = 'Selected: press Ctrl+C or Cmd+C';
    };
    try { navigator.clipboard.writeText(TEMPLATE).then(done, fallback); } catch (e) { fallback(); }
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el);
});
document.addEventListener('change', e => {
  if (e.target.name === 'examSize') {
    ui.examSize = Number(e.target.value);
    render();
    const checked = document.querySelector('input[name="examSize"]:checked');
    if (checked) checked.focus();
  } else if (e.target.id === 'examTimed') {
    ui.examTimed = e.target.checked;
  }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!run || (ui.screen !== 'play' && ui.screen !== 'exam')) return;
  const item = current();
  if (!item) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const idx = '1234'.includes(k) ? '1234'.indexOf(k) : 'abcd'.includes(k) ? 'abcd'.indexOf(k) : -1;
  if (idx >= 0 && idx < item.choices.length) {
    e.preventDefault();
    pick(idx);
    return;
  }
  const onButton = document.activeElement && document.activeElement.closest('button, a, input, summary');
  if (k === 'Enter' && !onButton && ui.screen === 'play') {
    e.preventDefault();
    if (item.done) advance(); else lockIn();
  }
  if (ui.screen === 'exam' && !onButton) {
    if (k === 'ArrowRight') examGo(run.index + 1);
    if (k === 'ArrowLeft') examGo(run.index - 1);
  }
});

/* ==================================================================
   START
   Progress is in memory only. Inside the Claude artifact viewer the
   hook below also carries it across page updates; elsewhere it does
   nothing.
   ================================================================== */
function boot(data) {
  if (data && data.state) Object.assign(state, data.state);
  render();
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ state: JSON.parse(JSON.stringify(state)) }));
if (hot && typeof hot.ready === 'function') hot.ready(boot);
else boot((hot && hot.data) || {});
</script>
</body>
